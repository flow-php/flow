on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  extension-tests:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"
        operating-system:
          - "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Install dependencies"
        run: |
          sudo apt-get update && sudo apt-get install libbrotli1 liblz4-1 libzstd1 --assume-yes

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"
          coverage: "pcov"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, brotli, lz4, zstd, snappy-https://github.com/kjdev/php-ext-snappy@0.2.1'
          php-env: '{"SNAPPY_CONFIGURE_PREFIX_OPTS": "CXXFLAGS=-std=c++11"}'
          cache-key-suffix: "-extensions"

      - name: "Test Brotli"
        run: "just test --group brotli-extension"

      - name: "Test LZ4"
        run: "just test --group lz4-extension"

      - name: "Test ZSTD"
        run: "just test --group zstd-extension"

      - name: "Test Snappy"
        run: "just test --group snappy-extension"

      - name: Upload to Codecov
        if: ${{ !cancelled() && matrix.php-version == '8.3' }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./var/phpunit/coverage/clover
          flags: extension-tests
