on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-archives:
    name: "Release"
    runs-on: ${{ matrix.operating-system }}
    permissions:
      contents: write
    strategy:
      matrix:
        php-version:
          - "8.3"
        operating-system:
          - "blacksmith-2vcpu-ubuntu-2404"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          coverage: "none"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
          cache-key-suffix: "-locked-phar"
          apt-packages: "build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev"
          pie-extensions: "flow-php/pg-query-ext:1.x-dev"

      - name: "Build PHAR file"
        run: "just phar"

      - name: "Validate Flow PHAR"
        run: |
          ./build/flow.phar --version

      - name: "Import GPG Key"
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: "Sign PHAR"
        run: >
          gpg
          --batch
          --yes
          --local-user="${{ secrets.GPG_USER_EMAIL }}"
          --passphrase="${{ secrets.GPG_PASSPHRASE }}"
          --pinentry-mode="loopback"
          --detach-sign
          --output="./build/flow.phar.asc"
          ./build/flow.phar

      - name: "Upload Flow PHAR for Docker build"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "docker-phar"
          path: "build/flow.phar"
          if-no-files-found: error
          retention-days: 1

      - name: "Upload binaries to release"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            build/flow.phar \
            build/flow.phar.asc \
            --clobber

  docker-image:
    needs: build-archives
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/job-docker-image.yml
    with:
      tags: "ghcr.io/flow-php/flow:${{ github.ref_name }}"
      phar-artifact: "docker-phar"

