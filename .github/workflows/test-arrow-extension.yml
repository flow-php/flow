name: Arrow Extension

on:
  pull_request:
    paths:
      - 'src/extension/arrow-ext/**'
      - '.github/workflows/test-arrow-extension.yml'
      - '.github/workflows/job-arrow-extension.yml'
      - '.github/actions/setup-php-env/**'
      - '.github/actions/composer-install/**'
      - '.github/actions/rust-extension-toolchain/**'
  push:
    branches: [ 1.x ]
    paths-ignore:
      - 'CHANGELOG.md'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arrow-extension:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/job-arrow-extension.yml
    with:
      full-matrix: ${{ github.event_name != 'pull_request' }}
