          MYSQL_DATABASE_URL: mysql://mysql:mysql@127.0.0.1:${{ job.services.mysql.ports[3306] }}/mysql

  bridge-filesystem-azure-tests:
    name: "Bridge Filesystem Azure - PHP ${{ matrix.php-version }} - ${{ matrix.dependencies }}"
