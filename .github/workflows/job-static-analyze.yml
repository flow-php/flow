on:
  workflow_call:

jobs:
  static-analyze:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"
        operating-system:
          - "blacksmith-4vcpu-ubuntu-2404"

    steps:
      - name: "Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"
          coverage: "none"
          extra-working-directory: "web/landing"
          extra-cache-key-suffix: "-website"
          extra-composer-file: "web/landing/composer.lock"

      - name: "Static Analyze"
        run: "just analyze"

      - name: "Install actionlint + zizmor"
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ZIZMOR_VERSION: "1.24.1"
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: "Lint"
        run: "just lint"
