on:
  workflow_call:

jobs:
  static-analyze:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"
        operating-system:
          - "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"
          coverage: "none"

      - name: "Create cache directories"
        run: |
          mkdir -p var/phpstan/cache

      - name: "Cache phpstan results"
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: "var/phpstan/cache"
          key: "php-${{ matrix.php-version }}-cache-phpstan-${{ github.run_id }}"
          restore-keys: |
            php-${{ matrix.php-version }}-cache-phpstan-

      - name: "Static Analyze (Mago)"
        run: "just analyze-mago"

      - name: "Install actionlint + zizmor"
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ZIZMOR_VERSION: "1.24.1"
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: "Lint"
        run: "just lint"

      - name: "Static Analyze"
        run: "just analyze --error-format=github"
