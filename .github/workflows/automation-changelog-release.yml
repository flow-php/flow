on:
  push:
    tags: [ '*' ]

permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: "Load GitHub App private key"
        id: app-credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: "2.42.0"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_PRIVATE_KEY: op://ci/github-app-flow-ci/private

      - name: "Create GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLOW_PHP_CI_CLIENT_ID }}
          private-key: ${{ steps.app-credentials.outputs.APP_PRIVATE_KEY }}
          owner: flow-php
          repositories: flow
          permission-contents: write
          permission-pull-requests: read

      - name: "Add new release to Changelog File"
        uses: docker://aeonphp/automation@sha256:efd2a2ed267aab2c45bed40540f0e522487c6817f5ae81f76032768b6ef47ed6
        env:
          AEON_AUTOMATION_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          entrypoint: "/composer/vendor/bin/automation"
          args: "changelog:release:unreleased ${{ github.repository }} CHANGELOG.md ${{ github.ref_name }} --github-file-changelog-update"
