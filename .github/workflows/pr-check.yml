on:
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: ["opened", "edited", "reopened", "ready_for_review", "synchronize"]

permissions:
  contents: read

jobs:
  pull-request-description:
    uses: "aeon-php/actions/.github/workflows/automation-pr-description-validate.yml@ed056e3e36c7011d5c0f633471e7d888737e628a" # main
    secrets:
      automation_github_token: "${{ secrets.GITHUB_TOKEN }}"

  pull-request-size:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9 # v1
        with:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          xs_label: 'size: XS'
          xs_max_size: 50
          s_label: 'size: S'
          s_max_size: 250
          m_label: 'size: M'
          m_max_size: 500
          l_label: 'size: L'
          l_max_size: 1000
          xl_label: 'size: XL'
          fail_if_xl: false
          files_to_ignore: 'composer.lock timezones.json nested_timezones.json'
          message_if_xl: ''
