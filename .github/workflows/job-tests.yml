on:
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: false
        default: '["locked"]'

jobs:
  tests:
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8.0.31-debian
        ports:
          - 3306/tcp
        env:
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
          MYSQL_DATABASE: mysql
          MYSQL_ROOT_PASSWORD: root
      elasticsearch:
        image: elasticsearch:7.17.28
        env:
          discovery.type: single-node
        options: >-
          --health-cmd "curl http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 9200:9200
      localstack:
        image: localstack/localstack:latest
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: s3
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
          - 4571:4571
    strategy:
      fail-fast: false
      matrix:
        dependencies: ${{ fromJSON(inputs.dependencies) }}
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"
        operating-system:
          - "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"

      - name: "Start OpenTelemetry Collector"
        run: |
          docker run -d --name otel-collector \
            -p 4317:4317 -p 4318:4318 -p 8888:8888 -p 13133:13133 \
            -v ${{ github.workspace }}/docker/otel-collector-test-config.yaml:/etc/otelcol-contrib/config.yaml:ro \
            otel/opentelemetry-collector-contrib:0.144.0
          # Wait for container to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:13133/ > /dev/null 2>&1; then
              echo "OpenTelemetry Collector is ready"
              break
            fi
            echo "Waiting for OpenTelemetry Collector... ($i/30)"
            sleep 2
          done

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"
          coverage: 'pcov'
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, curl, pgsql, grpc, protobuf'
          ini-values: 'memory_limit=-1, post_max_size=32M, upload_max_filesize=32M'
          apt-packages: "build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev"
          pie-extensions: "flow-php/pg-query-ext:1.x-dev"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Azurite storage emulator
        run: npm install -g azurite

      - name: Start Azurite blob endpoint
        shell: bash
        run: |
          azurite-blob --blobHost 0.0.0.0 --blobPort 10000 > azurite.log 2>&1 &
          for i in {1..30}; do
            if curl -f http://localhost:10000/ 2>/dev/null; then
              echo "Azurite is ready"
              break
            fi
            echo "Waiting for Azurite... ($i/30)"
            sleep 1
          done
          cat azurite.log
        env:
          AZURITE_ACCOUNTS: flowphpaccount01:flowphpkey01

      - name: "Test"
        timeout-minutes: 10
        run: "composer test -- --coverage-clover=./var/phpunit/coverage/clover/coverage.xml --log-junit ./var/phpunit/logs/junit.xml"
        env:
          PGSQL_DATABASE_URL: pgsql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?serverVersion=11&charset=utf8
          MYSQL_DATABASE_URL: mysql://mysql:mysql@127.0.0.1:${{ job.services.mysql.ports[3306] }}/mysql
          SQLITE_DATABASE_URL: "sqlite:///:memory:"
          AZURITE_HOST: "localhost"
          AZURITE_BLOB_PORT: "10000"
          AZURITE_ACCOUNT_NAME: "flowphpaccount01"
          AZURITE_ACCOUNT_KEY: "flowphpkey01"
          S3_ENDPOINT: "http://localhost:${{ job.services.localstack.ports[4566] }}"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY_ID: "test"
          S3_SECRET_ACCESS_KEY: "test"
          OTEL_RECEIVER_HTTP_ENDPOINT: "http://localhost:4318"
          OTEL_RECEIVER_GRPC_ENDPOINT: "localhost:4317"
          OTEL_COLLECTOR_METRICS_ENDPOINT: "http://localhost:8888/metrics"
          FLOW_PARQUET_TESTS_DEBUG: "0"

      - name: Upload to Codecov
        uses: ./.github/actions/codecov-report
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          php-version: ${{ matrix.php-version }}
          dependencies: ${{ matrix.dependencies }}
