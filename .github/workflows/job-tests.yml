on:
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: false
        default: '["locked"]'
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  tests:
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8.0.31-debian
        ports:
          - 3306/tcp
        env:
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
          MYSQL_DATABASE: mysql
          MYSQL_ROOT_PASSWORD: root
      elasticsearch:
        image: elasticsearch:8.19.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 9200/tcp
    strategy:
      fail-fast: false
      matrix:
        dependencies: ${{ fromJSON(inputs.dependencies) }}
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"
        operating-system:
          - "blacksmith-4vcpu-ubuntu-2404"
        exclude:
          - dependencies: "lowest"
            php-version: "8.4"
          - dependencies: "lowest"
            php-version: "8.5"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Start OpenTelemetry Collector"
        run: |
          docker run -d --name otel-collector \
            -p 4317:4317 -p 4318:4318 -p 8888:8888 -p 13133:13133 \
            -v ${{ github.workspace }}/docker/otel-collector-test-config.yaml:/etc/otelcol-contrib/config.yaml:ro \
            otel/opentelemetry-collector-contrib:0.153.0
          # Wait for container to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:13133/ > /dev/null 2>&1; then
              echo "OpenTelemetry Collector is ready"
              break
            fi
            echo "Waiting for OpenTelemetry Collector... ($i/30)"
            sleep 2
          done

      - name: "Start MinIO and create bucket"
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          timeout 30 sh -c 'until curl -fs http://localhost:9000/minio/health/live > /dev/null; do sleep 1; done'
          docker run --rm --network=host --entrypoint sh quay.io/minio/mc:latest -c "
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb local/flowphpbucket01 --ignore-existing
          "

      - name: "Start SFTP server"
        run: |
          docker run -d --name sftp -p 2222:22 \
            -v ${{ github.workspace }}/docker/sftp.json:/app/config/sftp.json:ro \
            emberstack/sftp:latest
          timeout 60 sh -c 'until nc -z localhost 2222; do sleep 1; done'
          echo "SFTP is ready"

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"
          coverage: ${{ (matrix.php-version == '8.3' && matrix.dependencies == 'locked') && 'pcov' || 'none' }}
          extensions: ':psr, apcu, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, curl, pgsql, grpc, protobuf'
          ini-values: 'memory_limit=-1, post_max_size=32M, upload_max_filesize=32M, apc.enable_cli=1'
          apt-packages: "build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev"
          pie-extensions: "flow-php/pg-query-ext:1.x-dev"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Azurite storage emulator
        run: npm install -g azurite

      - name: Start Azurite blob endpoint
        shell: bash
        run: |
          azurite-blob --blobHost 0.0.0.0 --blobPort 10000 > azurite.log 2>&1 &
          for i in {1..30}; do
            if curl -f http://localhost:10000/ 2>/dev/null; then
              echo "Azurite is ready"
              break
            fi
            echo "Waiting for Azurite... ($i/30)"
            sleep 1
          done
          cat azurite.log
        env:
          AZURITE_ACCOUNTS: flowphpaccount01:flowphpkey01

      # Main suite: everything except the grpc-exercising tests, so grpc is never
      # exercised here and the process shuts down cleanly. Must pass.
      - name: "Test"
        timeout-minutes: 15
        run: "just test --exclude-group grpc --log-junit ./var/phpunit/logs/junit.xml ${{ (matrix.php-version == '8.3' && matrix.dependencies == 'locked') && '--coverage-clover=./var/phpunit/coverage/clover/coverage.xml' || '' }}"
        env:
          PGSQL_DATABASE_URL: pgsql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?serverVersion=18&charset=utf8
          MYSQL_DATABASE_URL: mysql://mysql:mysql@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/mysql
          ELASTICSEARCH_URL: http://127.0.0.1:${{ job.services.elasticsearch.ports['9200'] }}
          SQLITE_DATABASE_URL: "sqlite:///:memory:"
          AZURITE_HOST: "localhost"
          AZURITE_BLOB_PORT: "10000"
          AZURITE_ACCOUNT_NAME: "flowphpaccount01"
          AZURITE_ACCOUNT_KEY: "flowphpkey01"
          S3_ENDPOINT: "http://localhost:9000"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY_ID: "minioadmin"
          S3_SECRET_ACCESS_KEY: "minioadmin"
          SFTP_HOST: "localhost"
          SFTP_PORT: "2222"
          SFTP_USER: "flow"
          SFTP_PASSWORD: "flow"
          OTEL_RECEIVER_HTTP_ENDPOINT: "http://localhost:4318"
          OTEL_RECEIVER_GRPC_ENDPOINT: "localhost:4317"
          OTEL_COLLECTOR_METRICS_ENDPOINT: "http://localhost:8888/metrics"
          FLOW_PARQUET_TESTS_DEBUG: "0"

      # gRPC-exercising tests, isolated. grpc's EventEngine threads race PHP's extension
      # dlclose at process shutdown on PHP 8.5/amd64 (upstream grpc#38216, no released fix),
      # so this step is allowed to fail ONLY on 8.5. A real grpc test regression on 8.3/8.4
      # still fails CI. Remove continue-on-error once grpc ships a fix.
      - name: "Test (grpc)"
        timeout-minutes: 10
        continue-on-error: ${{ matrix.php-version == '8.5' }}
        run: "just test --group grpc --log-junit ./var/phpunit/logs/grpc-junit.xml ${{ (matrix.php-version == '8.3' && matrix.dependencies == 'locked') && '--coverage-clover=./var/phpunit/coverage/clover/grpc-coverage.xml' || '' }}"
        env:
          PGSQL_DATABASE_URL: pgsql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?serverVersion=18&charset=utf8
          MYSQL_DATABASE_URL: mysql://mysql:mysql@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/mysql
          SQLITE_DATABASE_URL: "sqlite:///:memory:"
          AZURITE_HOST: "localhost"
          AZURITE_BLOB_PORT: "10000"
          AZURITE_ACCOUNT_NAME: "flowphpaccount01"
          AZURITE_ACCOUNT_KEY: "flowphpkey01"
          S3_ENDPOINT: "http://localhost:9000"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY_ID: "minioadmin"
          S3_SECRET_ACCESS_KEY: "minioadmin"
          OTEL_RECEIVER_HTTP_ENDPOINT: "http://localhost:4318"
          OTEL_RECEIVER_GRPC_ENDPOINT: "localhost:4317"
          OTEL_COLLECTOR_METRICS_ENDPOINT: "http://localhost:8888/metrics"
          FLOW_PARQUET_TESTS_DEBUG: "0"

      - name: Upload to Codecov
        uses: ./.github/actions/codecov-report
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          php-version: ${{ matrix.php-version }}
          dependencies: ${{ matrix.dependencies }}
