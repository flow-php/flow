name: PG Query Extension

on:
  workflow_call:

jobs:
  build:
    name: Build and Test Extension
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          extensions: json

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool protobuf protobuf-c

      - name: Build libpg_query and extension
        working-directory: src/extension/pg-query-parser
        run: |
          make clean || true
          make build

      - name: Run extension tests
        working-directory: src/extension/pg-query-parser
        run: make test

      - name: Install composer dependencies
        working-directory: src/extension/pg-query-parser
        run: composer install --no-interaction

      - name: Run PHP tests
        working-directory: src/extension/pg-query-parser
        run: php -d extension=./ext/modules/pg_query.so vendor/bin/phpunit
