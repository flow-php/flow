name: PG Query Extension

on:
  workflow_call:
    inputs:
      full-matrix:
        description: "Build macOS on every PHP version, NTS and ZTS, and test the macOS PIE install; otherwise macOS builds PHP 8.3 NTS only"
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: Build and Test Extension (Linux)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
        ts: ['nts', 'zts']
        include:
          - php: '8.3'
            dependencies: locked
          - php: '8.4'
            dependencies: highest
          - php: '8.5'
            dependencies: highest
          - php: '8.6'
            dependencies: highest

    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs history and tags to resolve the extension version
          fetch-depth: 0

      - name: Setup PHP Environment
        uses: ./.github/actions/setup-php-env
        with:
          php-version: ${{ matrix.php }}
          thread-safety: ${{ matrix.ts }}
          dependencies: ${{ matrix.dependencies }}
          coverage: none
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, protobuf'
          tools: 'composer:v2, phpize, php-config'

      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool protobuf protobuf-c

      - name: Build libpg_query and extension
        working-directory: src/extension/pg-query-ext
        run: |
          make clean || true
          make build

      - name: Run extension tests
        working-directory: src/extension/pg-query-ext
        run: make test

      - name: Install extension
        working-directory: src/extension/pg-query-ext
        run: |
          EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
          sudo cp ext/modules/pg_query.so "$EXT_DIR/"
          echo "extension=pg_query.so" | sudo tee -a "$(php -r 'echo php_ini_loaded_file();')"
          php -m | grep pg_query

  build-macos:
    name: Build and Test Extension (macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            ts: nts
            dependencies: locked

    steps: *build-steps

  build-macos-full-matrix:
    name: Build and Test Extension (macOS, full matrix)
    if: ${{ inputs.full-matrix }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
        ts: ['nts', 'zts']
        exclude:
          - php: '8.3'
            ts: nts
        include:
          - php: '8.3'
            dependencies: locked
          - php: '8.4'
            dependencies: highest
          - php: '8.5'
            dependencies: highest
          - php: '8.6'
            dependencies: highest

    steps: *build-steps

  pie-install-test:
    name: Test PIE Installation (Linux)
    runs-on: ubuntu-24.04

    steps: &pie-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs history and tags to resolve the extension version
          fetch-depth: 0

      - name: Setup PHP Environment
        uses: ./.github/actions/setup-php-env
        with:
          php-version: '8.3'
          dependencies: locked
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
          tools: 'composer:v2, phpize, php-config'

      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool protobuf protobuf-c

      - name: Install PIE
        run: |
          sudo curl -L -o /usr/local/bin/pie https://github.com/php/pie/releases/latest/download/pie.phar
          sudo chmod +x /usr/local/bin/pie
          pie --version

      - name: Prepare local package for PIE installation
        run: |
          # git archive applies export-subst like GitHub release archives, so the build resolves its version from .git_archival.txt
          git archive HEAD src/extension/pg-query-ext | tar -x -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/src/extension/pg-query-ext"
          jq '. + {"version": "0.0.9999"}' composer.json > composer.tmp.json
          mv composer.tmp.json composer.json

      - name: Install extension via PIE (from local)
        run: |
          sudo pie repository:remove packagist.org
          sudo pie repository:add path "$RUNNER_TEMP/src/extension/pg-query-ext"
          sudo pie install flow-php/pg-query-ext:0.0.9999@dev

      - name: Verify extension is loaded
        run: |
          php -m | grep pg_query

      - name: Verify extension version
        run: |
          expected="$(git describe --tags --match '[0-9]*' | sed -E 's/-([0-9]+)-(g[0-9a-f]+)$/+\1.\2/')"
          actual="$(php -r 'echo phpversion("pg_query");')"
          echo "expected: $expected, actual: $actual"
          test "$actual" = "$expected"

  pie-install-test-macos:
    name: Test PIE Installation (macOS)
    if: ${{ inputs.full-matrix }}
    runs-on: macos-latest

    steps: *pie-steps
