name: Arrow Extension

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build:
    name: Build and Test Extension
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['blacksmith-2vcpu-ubuntu-2404', 'macos-latest']
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP Environment
        uses: ./.github/actions/setup-php-env
        with:
          php-version: ${{ matrix.php }}
          dependencies: locked
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, zstd'
          tools: 'composer:v2, php-config'
          coverage: 'pcov'
          install-dependencies: 'false'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/extension/arrow-ext/target
          key: ${{ runner.os }}-php${{ matrix.php }}-cargo-${{ hashFiles('src/extension/arrow-ext/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-cargo-

      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          # Pin the clang executable to the one shipped with the same llvm as
          # libclang. Otherwise clang-sys (used by ext-php-rs's bindgen) falls
          # back to `xcodebuild -find clang` and mixes Xcode's clang headers
          # (e.g. arm_neon.h) with brew's newer libclang, which fails to compile.
          echo "CLANG_PATH=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Find the canonical libclang.so shared library, excluding the
          # Clang runtime support libraries under llvm-*/lib/clang/*/lib/.
          LIBCLANG_SO=$(find /usr/lib \
            \( -name 'libclang.so' -o -name 'libclang.so.*' -o -name 'libclang-*.so' -o -name 'libclang-*.so.*' \) \
            -not -path '*/clang/*/lib/*' \
            2>/dev/null | head -1)
          if [ -z "$LIBCLANG_SO" ]; then
            echo "Could not locate libclang.so under /usr/lib" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_SO")" >> "$GITHUB_ENV"
          echo "Detected libclang at: $LIBCLANG_SO"

      - name: Build extension
        working-directory: src/extension/arrow-ext
        run: make build

      - name: Run PHPT tests
        working-directory: src/extension/arrow-ext
        run: make test

      - name: Install extension and verify
        working-directory: src/extension/arrow-ext
        run: |
          EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
          sudo cp ext/modules/arrow.so "$EXT_DIR/"
          echo "extension=arrow.so" | sudo tee -a "$(php -r 'echo php_ini_loaded_file();')"
          php -m | grep arrow

      - name: Install Composer Dependencies
        uses: ./.github/actions/composer-install
        with:
          php-version: ${{ matrix.php }}
          dependencies: locked

      - name: Run Parquet Integration Tests with Arrow
        run: just test --testsuite=lib-parquet-integration ${{ (matrix.php == '8.3' && matrix.os == 'ubuntu-latest') && '--coverage-clover=./var/phpunit/coverage/clover/coverage.xml' || '' }}

      - name: Upload to Codecov
        if: ${{ !cancelled() && matrix.php == '8.3' && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./var/phpunit/coverage/clover
          flags: arrow-extension

  pie-install-test:
    name: Test PIE Installation
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        os: ['blacksmith-2vcpu-ubuntu-2404', 'macos-latest']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP Environment
        uses: ./.github/actions/setup-php-env
        with:
          php-version: '8.3'
          dependencies: locked
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
          tools: 'composer:v2, phpize, php-config'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool clang libclang-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          # See the build job: keep clang and libclang from the same llvm so
          # bindgen does not mix brew's libclang with Xcode's clang headers.
          echo "CLANG_PATH=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Find the canonical libclang.so shared library, excluding the
          # Clang runtime support libraries under llvm-*/lib/clang/*/lib/.
          LIBCLANG_SO=$(find /usr/lib \
            \( -name 'libclang.so' -o -name 'libclang.so.*' -o -name 'libclang-*.so' -o -name 'libclang-*.so.*' \) \
            -not -path '*/clang/*/lib/*' \
            2>/dev/null | head -1)
          if [ -z "$LIBCLANG_SO" ]; then
            echo "Could not locate libclang.so under /usr/lib" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_SO")" >> "$GITHUB_ENV"
          echo "Detected libclang at: $LIBCLANG_SO"

      - name: Install PIE
        run: |
          sudo curl -L -o /usr/local/bin/pie https://github.com/php/pie/releases/latest/download/pie.phar
          sudo chmod +x /usr/local/bin/pie
          pie --version

      - name: Prepare local package for PIE installation
        working-directory: src/extension/arrow-ext
        run: |
          jq '. + {"version": "0.0.9999"}' composer.json > composer.tmp.json
          mv composer.tmp.json composer.json

      - name: Install extension via PIE (from local)
        run: |
          sudo pie repository:remove packagist.org
          sudo pie repository:add path ${{ github.workspace }}/src/extension/arrow-ext
          sudo env "PATH=$PATH" "LIBCLANG_PATH=$LIBCLANG_PATH" ${CLANG_PATH:+"CLANG_PATH=$CLANG_PATH"} "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=$RUSTUP_HOME" pie install flow-php/arrow-ext:0.0.9999@dev

      - name: Verify extension is loaded
        run: |
          php -m | grep arrow
