name: Arrow Extension

on:
  workflow_call:
    inputs:
      full-matrix:
        description: "Build macOS on every PHP version and test the macOS PIE install; otherwise macOS builds the newest PHP only"
        type: boolean
        required: false
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build:
    name: Build and Test Extension
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['blacksmith-2vcpu-ubuntu-2404', 'macos-latest']
        php: ['8.3', '8.4', '8.5']
        exclude: ${{ fromJSON(inputs.full-matrix && '[]' || '[{"os":"macos-latest","php":"8.3"},{"os":"macos-latest","php":"8.4"}]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs history and tags to resolve the extension version
          fetch-depth: 0

      - name: Setup PHP Environment
        uses: ./.github/actions/setup-php-env
        with:
          php-version: ${{ matrix.php }}
          dependencies: locked
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, zstd'
          tools: 'composer:v2, php-config'
          coverage: 'pcov'
          install-dependencies: 'false'

      - name: Setup Rust extension toolchain
        id: rust
        uses: ./.github/actions/rust-extension-toolchain

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # ext-php-rs bindings are generated against the PHP headers, so builds are per PHP version
          key: php${{ matrix.php }}
          workspaces: |
            src/extension/arrow-ext -> target

      - name: Build extension
        working-directory: src/extension/arrow-ext
        env: &rust-env
          LIBCLANG_PATH: ${{ steps.rust.outputs.libclang-path }}
          CLANG_PATH: ${{ steps.rust.outputs.clang-path }}
        run: make build

      - name: Test arrow crate
        working-directory: src/extension/arrow-ext
        env: *rust-env
        run: cargo test --locked --features arrow-validate

      - name: Lint arrow crate
        working-directory: src/extension/arrow-ext
        env: *rust-env
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings

      - name: Install Composer Dependencies
        uses: ./.github/actions/composer-install
        with:
          php-version: ${{ matrix.php }}
          dependencies: locked

      - name: Run PHPT tests
        working-directory: src/extension/arrow-ext
        env: *rust-env
        run: make test

      - name: Install extension and verify
        working-directory: src/extension/arrow-ext
        env: *rust-env
        run: |
          make build
          EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
          sudo cp ext/modules/arrow.so "$EXT_DIR/"
          echo "extension=arrow.so" | sudo tee -a "$(php -r 'echo php_ini_loaded_file();')"
          php -m | grep arrow

      - name: Run Parquet Integration Tests with Arrow
        run: just test --testsuite=lib-parquet-integration ${{ (matrix.php == '8.3' && runner.os == 'Linux') && '--coverage-clover=./var/phpunit/coverage/clover/coverage.xml' || '' }}

      - name: Upload to Codecov
        if: ${{ !cancelled() && matrix.php == '8.3' && runner.os == 'Linux' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./var/phpunit/coverage/clover
          flags: arrow-extension

  pie-install-test:
    name: Test PIE Installation
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        os: ['blacksmith-2vcpu-ubuntu-2404', 'macos-latest']
        exclude: ${{ fromJSON(inputs.full-matrix && '[]' || '[{"os":"macos-latest"}]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs history and tags to resolve the extension version
          fetch-depth: 0

      - name: Setup PHP Environment
        uses: ./.github/actions/setup-php-env
        with:
          php-version: '8.3'
          dependencies: locked
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
          tools: 'composer:v2, phpize, php-config'

      - name: Setup Rust extension toolchain
        id: rust
        uses: ./.github/actions/rust-extension-toolchain

      - name: Install PIE
        run: |
          sudo curl -L -o /usr/local/bin/pie https://github.com/php/pie/releases/latest/download/pie.phar
          sudo chmod +x /usr/local/bin/pie
          pie --version

      - name: Prepare local package for PIE installation
        run: |
          # git archive applies export-subst like GitHub release archives, so the build resolves its version from .git_archival.txt
          git archive HEAD src/extension/arrow-ext | tar -x -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/src/extension/arrow-ext"
          jq '. + {"version": "0.0.9999"}' composer.json > composer.tmp.json
          mv composer.tmp.json composer.json

      - name: Install extension via PIE (from local)
        env:
          LIBCLANG_PATH: ${{ steps.rust.outputs.libclang-path }}
          CLANG_PATH: ${{ steps.rust.outputs.clang-path }}
        run: |
          sudo pie repository:remove packagist.org
          sudo pie repository:add path "$RUNNER_TEMP/src/extension/arrow-ext"
          sudo env "PATH=$PATH" "LIBCLANG_PATH=$LIBCLANG_PATH" ${CLANG_PATH:+"CLANG_PATH=$CLANG_PATH"} "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=$RUSTUP_HOME" pie install flow-php/arrow-ext:0.0.9999@dev

      - name: Verify extension is loaded
        run: |
          php -m | grep arrow

      - name: Verify extension version
        run: |
          describe="$(git describe --tags --match '[0-9]*')"
          if git describe --exact-match --tags --match '[0-9]*' HEAD >/dev/null 2>&1; then
            expected="$describe"
          else
            # commits past a tag are a pre-release of the next minor: 0.44.1-65-g4525c4adc -> 0.45.0-dev+65.g4525c4adc
            expected="$(echo "$describe" | awk -F- '{split($1, v, "."); printf "%d.%d.0-dev+%s.%s", v[1], v[2] + 1, $2, $3}')"
          fi
          actual="$(php -r 'echo phpversion("arrow");')"
          echo "expected: $expected, actual: $actual"
          test "$actual" = "$expected"
