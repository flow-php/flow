name: Build Docker Base Image

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  push:
    branches: [ 1.x ]
    paths:
      - 'Dockerfile.base'

jobs:
  build-base-image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Base Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            FLOW_PHP_VERSION=${{ matrix.php-version }}
          tags: |
            ghcr.io/flow-php/flow-base:${{ matrix.php-version }}-alpine
            ghcr.io/flow-php/flow-base:latest
          cache-from: type=registry,ref=ghcr.io/flow-php/flow-base:${{ matrix.php-version }}-alpine
          cache-to: type=inline
