on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git Tag Name'
        required: false
      branch_name:
        description: 'Git Branch Name'
        required: true
        default: '1.x'
  push:
    branches: [ 1.x ]
    paths-ignore:
      - 'CHANGELOG.md'
  schedule:
    - cron: '0 3 * * *'

jobs:
  build-archives:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"
        with:
          fetch-depth: 0

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          coverage: "none"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
          cache-key-suffix: "-locked-phar"
          apt-packages: "build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev"
          pie-extensions: "flow-php/pg-query-ext:1.x-dev"

      - name: "Build PHAR file"
        run: "composer build:phar"

      - name: "Validate Flow PHAR"
        run: |
          ./build/flow.phar --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/flow-php/flow:latest
          target: flow
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Prepare artifact name"
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          BUILD_TAG=${GITHUB_SHA:0:7}
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v6
        with:
          name: flow-${{ env.BUILD_TAG }}.phar
          path: build/flow.phar
          overwrite: true

  benchmark-baseline:
    runs-on: benchmark

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"

    steps:
      - name: "Set Git Ref"
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "schedule" ]]; then
            echo "GIT_REF=${{ github.ref }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.tag_name }}" != "" ]]; then
            echo "GIT_REF=refs/tags/${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "GIT_REF=${{ github.event.inputs.branch_name }}" >> $GITHUB_ENV
          fi

      - name: "Set Benchmark Tag"
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "schedule" ]]; then
            echo "PHPBENCH_TAG=1.x" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.tag_name }}" != "" ]]; then
            echo "PHPBENCH_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "PHPBENCH_TAG=${{ github.event.inputs.branch_name }}" >> $GITHUB_ENV
          fi

      - name: "Checkout to specific ref"
        uses: "actions/checkout@v5"
        with:
          ref: ${{ env.GIT_REF }}

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          coverage: "none"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, pgsql, snappy-https://github.com/kjdev/php-ext-snappy@0.2.1'
          cache-key-suffix: "-locked"
          apt-packages: "build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev"
          pie-extensions: "flow-php/pg-query-ext:1.x-dev"

      - name: "Generate phpbench.json with dynamic port"
        run: |
          sed 's/127.0.0.1:5432/127.0.0.1:${{ job.services.postgres.ports[5432] }}/' phpbench.json.dist > phpbench.json

      - name: "Start OpenTelemetry Collector"
        run: |
          docker run -d --name otel-collector \
            -p 4317:4317 -p 4318:4318 -p 8888:8888 -p 13133:13133 \
            -v ${{ github.workspace }}/docker/otel-collector-test-config.yaml:/etc/otelcol-contrib/config.yaml:ro \
            otel/opentelemetry-collector-contrib:0.115.1
          # Wait for container to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:13133/ > /dev/null 2>&1; then
              echo "OpenTelemetry Collector is ready"
              break
            fi
            echo "Waiting for OpenTelemetry Collector... ($i/30)"
            sleep 2
          done

      - name: "Benchmark"
        env:
          OTEL_RECEIVER_HTTP_ENDPOINT: "http://localhost:4318"
          OTEL_RECEIVER_GRPC_ENDPOINT: "localhost:4317"
          OTEL_COLLECTOR_METRICS_ENDPOINT: "http://localhost:8888/metrics"
        run: |
          # Phase 1: Run with progress visible, store results
          tools/phpbench/vendor/bin/phpbench run \
            --progress=plain \
            --store \
            --tag=${{ env.PHPBENCH_TAG }}

          # Phase 2: Generate clean report from stored results
          echo '# Flow PHP - Benchmark - ${{ env.PHPBENCH_TAG }}' >> $GITHUB_STEP_SUMMARY
          echo ' ' >> $GITHUB_STEP_SUMMARY
          echo '---' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tools/phpbench/vendor/bin/phpbench report \
            --ref=${{ env.PHPBENCH_TAG }} \
            --report=flow-report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "Store Benchmark baseline"
        uses: actions/upload-artifact@v6
        with:
          name: phpbench-baseline
          path: ./var/phpbench/
          overwrite: true

  publish-website:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"
        with:
          fetch-depth: 0

      - name: "Get Flow Version"
        id: flow_version
        uses: "WyriHaximus/github-action-get-previous-tag@v1"
        with:
          fallback: 1.x-dev

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
          cache-key-suffix: "-website-phar"
          apt-packages: "build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev"
          pie-extensions: "flow-php/pg-query-ext:1.x-dev"

      - name: "Generate documentation"
        run: "composer build:docs"

      - name: "Build latest version Flow Phar for playground"
        run: "composer build:phar"

      - name: "Install Landing dependencies"
        run: "composer install --no-interaction --no-progress "
        working-directory: "web/landing"

      - name: "Build"
        run: "composer build"
        env:
          SCHEME: https
          DOMAIN: flow-php.com
          PLAYGROUND_API_URL: https://flow-php.com/api/playground/snippets
          PLAYGROUND_SNIPPETS_URL: https://playground-snippets.flow-php.com
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          UMAMI_ID: '${{ vars.UMAMI_ID }}'
          FLOW_VERSION: ${{ steps.flow_version.outputs.tag }}
        working-directory: "web/landing"

      - name: "Generate Api References"
        run: "composer build:docs:api"

      - name: Pushes build to website repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.ACCESS_TOKEN }}
        with:
          source-directory: 'web/landing/build'
          destination-github-username: 'flow-php'
          destination-repository-name: 'flow-php.com'
