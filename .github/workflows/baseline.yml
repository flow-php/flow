on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git Tag Name'
        required: false
      branch_name:
        description: 'Git Branch Name'
        required: true
        default: '1.x'
  push:
    branches: [ 1.x ]
    paths-ignore:
      - 'CHANGELOG.md'
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  build-phar:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          coverage: "none"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
          cache-key-suffix: "-locked-phar"

      - name: "Build pg-query-ext from source"
        uses: "./.github/actions/pg-query-ext"

      - name: "Build PHAR file"
        run: "just phar"

      - name: "Validate Flow PHAR"
        run: |
          ./build/flow.phar --version

      - name: "Upload Flow PHAR for Docker build"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "docker-phar"
          path: "build/flow.phar"
          if-no-files-found: error
          retention-days: 1

      - name: "Prepare artifact name"
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          BUILD_TAG=${GITHUB_SHA:0:7}
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-${{ env.BUILD_TAG }}.phar
          path: build/flow.phar
          overwrite: true

  docker-image:
    needs: build-phar
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/job-docker-image.yml
    with:
      tags: "ghcr.io/flow-php/flow:latest"
      phar-artifact: "docker-phar"
      no-cache: ${{ github.event_name == 'schedule' }}

  publish-website:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Get Flow Version"
        id: flow_version
        uses: WyriHaximus/github-action-get-previous-tag@83f26fea93bc7efcbca2eb5591f5eaaf66b8f206 # v2.1.0
        with:
          fallback: 1.x-dev

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
          cache-key-suffix: "-website-phar"
          extra-working-directory: "web/landing"
          extra-cache-key-suffix: "-website"
          extra-composer-file: "web/landing/composer.lock"

      - name: "Build pg-query-ext from source"
        uses: "./.github/actions/pg-query-ext"

      - name: "Generate documentation"
        run: "just docs"

      - name: "Build latest version Flow Phar for playground"
        run: "just phar"

      - name: "Build"
        run: "composer build"
        env:
          SCHEME: https
          DOMAIN: flow-php.com
          PLAYGROUND_API_URL: https://flow-php.com/api/playground/snippets
          PLAYGROUND_SNIPPETS_URL: https://playground-snippets.flow-php.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLOW_VERSION: ${{ steps.flow_version.outputs.tag }}
        working-directory: "web/landing"

      - name: "Generate Api References"
        run: "just docs-api"

      - name: "Setup Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: "Build Pagefind index"
        run: "npx --yes pagefind@1.5.2 --site web/landing/build --output-subdir pagefind"

      - name: "Load GitHub App private key"
        id: app-credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: "2.42.0"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_PRIVATE_KEY: op://ci/github-app-flow-ci/private

      - name: "Create GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLOW_PHP_CI_CLIENT_ID }}
          private-key: ${{ steps.app-credentials.outputs.APP_PRIVATE_KEY }}
          owner: flow-php
          repositories: flow-php.com
          permission-contents: write

      - name: "Resolve GitHub App bot identity"
        id: bot
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          {
            echo "name=${APP_SLUG}[bot]"
            echo "email=${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - name: "Push build to website repository"
        env:
          WEBSITE_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT_MESSAGE: "Update from https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          helper="!f() { echo username=x-access-token; echo \"password=\${WEBSITE_TOKEN}\"; }; f"
          git -c credential.helper= -c credential.helper="$helper" clone --quiet --depth 1 --branch main \
            https://github.com/flow-php/flow-php.com.git "$target"
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a web/landing/build/. "$target/"
          git -C "$target" add --all
          if git -C "$target" diff --cached --quiet; then
            echo "flow-php.com is up to date."
            exit 0
          fi
          git -C "$target" \
            -c user.name="$BOT_NAME" \
            -c user.email="$BOT_EMAIL" \
            commit --quiet -m "$COMMIT_MESSAGE"
          git -C "$target" -c credential.helper= -c credential.helper="$helper" push --quiet origin HEAD:main
