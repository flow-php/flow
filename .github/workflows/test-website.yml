on:
  pull_request:
    paths:
      - 'web/**'
      # the playground runs Flow from a phar built out of src, and PlaygroundExamplesTest is the
      # only thing that executes the published examples
      - 'src/**'
  push:
    branches: [ 1.x ]
    paths:
      - 'web/**'
      - 'src/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-phar:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "8.3"
          dependencies: "locked"
          coverage: "none"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
          cache-key-suffix: "-locked-phar"
          apt-packages: "build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev"
          pie-extensions: "flow-php/pg-query-ext:1.x-dev"

      - name: "Build PHAR file"
        run: "just phar"

      - name: "Upload Flow PHAR"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "website-flow-phar"
          path: "web/landing/assets/wasm/tools/flow.phar"
          retention-days: 1

  website-tests:
    needs: build-phar
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"
        operating-system:
          - "blacksmith-2vcpu-ubuntu-2404"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Get Flow Version"
        id: flow_version
        uses: WyriHaximus/github-action-get-previous-tag@61819f33034117e6c686e6a31dba995a85afc9de # v2.0.0
        with:
          fallback: 1.x-dev

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          coverage: "pcov"
          working-directory: "web/landing"
          cache-key-suffix: "-website"
          composer-file: "web/landing/composer.lock"

      - name: "Setup Node.js"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: "Create Wrangler dev.vars"
        run: |
          cat > .dev.vars << EOF
          TURNSTILE_SECRET_KEY=dummy
          TURNSTILE_MODE=bypass
          ENABLE_R2_PROXY=true
          RATE_LIMITER_MODE=bypass
          EOF
        working-directory: "terraform/cloudflare/workers"

      - name: "Start Wrangler in background"
        run: |
          npx wrangler@latest dev --port 8787 > wrangler.log 2>&1 &
          echo $! > wrangler.pid
          # Wait for wrangler to be ready
          timeout 30 bash -c 'until curl -s http://localhost:8787 > /dev/null; do sleep 1; done'
        working-directory: "terraform/cloudflare/workers"

      # replaces the committed phar so the playground runs this commit's Flow, not whatever was
      # last checked in
      - name: "Download Flow PHAR"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "website-flow-phar"
          path: "web/landing/assets/wasm/tools"

      # the website suite runs on the monorepo phpunit, not a copy of its own
      - name: "Install PHPUnit"
        run: "composer install --working-dir=tools/phpunit"

      - name: "Install Playwright browsers"
        run: "vendor/bin/playwright-install --with-deps"
        working-directory: "web/landing"

      - name: "Test"
        run: "just test-website"
        env:
          PLAYGROUND_API_URL: "http://localhost:8787/api/playground/snippets"
          PLAYGROUND_SNIPPETS_URL: "http://localhost:8787"
          PLAYWRIGHT_HEADLESS: "true"

      - name: "Stop Wrangler"
        if: always()
        run: |
          if [ -f wrangler.pid ]; then
            kill "$(cat wrangler.pid)" || true
          fi
          if [ -f wrangler.log ]; then
            echo "=== Wrangler Logs ==="
            cat wrangler.log
          fi
        working-directory: "terraform/cloudflare/workers"

      - name: "Test Build"
        run: "composer build"
        working-directory: "web/landing"
        env:
          SCHEME: https
          DOMAIN: flow-php.com
          FLOW_VERSION: ${{ steps.flow_version.outputs.tag }}
