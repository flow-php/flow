name: PG Query Extension

on:
  pull_request:
    paths:
      - 'src/extension/pg-query-ext/**'
      - '.github/workflows/test-pg-query-extension.yml'
      - '.github/workflows/job-pg-query-extension.yml'
      - '.github/actions/setup-php-env/**'
      - '.github/actions/composer-install/**'
  push:
    branches: [ 1.x ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pg-query-extension:
    uses: ./.github/workflows/job-pg-query-extension.yml
    with:
      full-matrix: ${{ github.event_name != 'pull_request' }}
