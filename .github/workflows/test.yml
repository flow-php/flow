  extension-flow-php-pie-install-test:
    needs: changes
    if: ${{ needs.changes.outputs.extension-flow-php == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: stable

    steps: &extension-flow-php-pie-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs history and tags to resolve the extension version
          fetch-depth: 0

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.3'
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2, phpize, php-config'

      - name: Install Composer Dependencies
        uses: ./.github/actions/composer-install
        with:
          php-version: '8.3'
          dependencies: locked

      - name: Setup Rust extension toolchain
        id: rust
        uses: ./.github/actions/setup-rust-toolchain

      - name: Install PIE
        run: |
          sudo curl -L -o /usr/local/bin/pie https://github.com/php/pie/releases/latest/download/pie.phar
          sudo chmod +x /usr/local/bin/pie
          pie --version

      - name: Prepare local package for PIE installation
        run: |
          # git archive applies export-subst like GitHub release archives, so the build resolves its version from .git_archival.txt
          git archive HEAD src/extension/flow-php-ext src/extension/parquet-engine | tar -x -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/src/extension/flow-php-ext"
          jq '. + {"version": "0.0.9999"}' composer.json > composer.tmp.json
          mv composer.tmp.json composer.json

      - name: Install extension via PIE (from local)
        env:
          LIBCLANG_PATH: ${{ steps.rust.outputs.libclang-path }}
          CLANG_PATH: ${{ steps.rust.outputs.clang-path }}
        run: |
          sudo pie repository:remove packagist.org
          sudo pie repository:add path "$RUNNER_TEMP/src/extension/flow-php-ext"
          sudo env "PATH=$PATH" "LIBCLANG_PATH=$LIBCLANG_PATH" ${CLANG_PATH:+"CLANG_PATH=$CLANG_PATH"} "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=$RUSTUP_HOME" pie install flow-php/flow-php-ext:0.0.9999@dev

