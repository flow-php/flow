name: test

on:
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.diff.outputs.php }}
      extension-flow-php: ${{ steps.diff.outputs.extension-flow-php }}
      extension-arrow: ${{ steps.diff.outputs.extension-arrow }}
      extension-pg-query: ${{ steps.diff.outputs.extension-pg-query }}
      website: ${{ steps.diff.outputs.website }}
      documentation: ${{ steps.diff.outputs.documentation }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Detect changed areas"
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          fi
          area() {
            if [ "$EVENT_NAME" != "pull_request" ] || grep -qE "$2" <<< "$changed"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi
          }
          {
            area php '^(\.github/workflows/test\.yml$|\.github/actions/|src/|benchmarks/|tools/|\.nix/pkgs/)|^(composer\.lock|composer\.json|phpunit\.xml\.dist)$'
            area extension-flow-php '^(src/extension/flow-php-ext/|src/extension/arrow-ext/|src/extension/parquet-engine/|\.github/workflows/test\.yml$|\.github/actions/(setup-php|composer-install|setup-rust-toolchain|enable-php-extension)/)'
            area extension-arrow '^(src/extension/arrow-ext/|src/extension/parquet-engine/|\.github/workflows/test\.yml$|\.github/actions/(setup-php|composer-install|setup-rust-toolchain|enable-php-extension)/)'
            area extension-pg-query '^(src/extension/pg-query-ext/|\.github/workflows/test\.yml$|\.github/actions/(setup-php|composer-install|enable-php-extension)/)'
            area website '^(web/|src/)'
            area documentation '^(src/|documentation/|web/landing/)|^(Justfile|README\.md)$'
          } >> "$GITHUB_OUTPUT"

  static-analyze:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"
        operating-system:
          - "ubuntu-24.04"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup PHP"
        uses: "./.github/actions/setup-php"
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2'
          coverage: "none"

      - name: "Install just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: "Install Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"

      - name: "Install website Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"
          working-directory: "web/landing"
          cache-key-suffix: "-website"
          composer-file: "web/landing/composer.lock"

      - name: "Static Analyze"
        run: "just analyze"

      - name: "Install actionlint + zizmor"
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ZIZMOR_VERSION: "1.24.1"
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: "Lint"
        run: "just lint"

  tests:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 25
      mysql:
        image: mysql:8.0.31-debian
        ports:
          - 3306/tcp
        env:
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
          MYSQL_DATABASE: flow
          MYSQL_ROOT_PASSWORD: root
      elasticsearch:
        image: elasticsearch:8.19.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl http://localhost:9200/_cluster/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
        ports:
          - 9200/tcp
    strategy:
      fail-fast: false
      matrix:
        # composer.lock is resolved on PHP 8.3, so only 8.3 installs it; a newer PHP resolves its own set
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"php-version":"8.3","dependencies":"locked","coverage":true},{"php-version":"8.4","dependencies":"highest"},{"php-version":"8.5","dependencies":"highest"},{"php-version":"8.6","dependencies":"highest"}]'
          || '[{"php-version":"8.3","dependencies":"locked","coverage":true},{"php-version":"8.3","dependencies":"lowest"},{"php-version":"8.4","dependencies":"lowest"},{"php-version":"8.5","dependencies":"lowest"},{"php-version":"8.6","dependencies":"lowest"}]') }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Start OpenTelemetry Collector"
        run: |
          docker run -d --name otel-collector \
            -p 4317:4317 -p 4318:4318 -p 8888:8888 -p 13133:13133 \
            -v ${{ github.workspace }}/docker/otel-collector-test-config.yaml:/etc/otelcol-contrib/config.yaml:ro \
            otel/opentelemetry-collector-contrib:0.153.0
          # Wait for container to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:13133/ > /dev/null 2>&1; then
              echo "OpenTelemetry Collector is ready"
              break
            fi
            echo "Waiting for OpenTelemetry Collector... ($i/30)"
            sleep 2
          done

      - name: "Start RustFS"
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=flowphpaccess01 \
            -e RUSTFS_SECRET_KEY=flowphpsecret01 \
            -e RUSTFS_ADDRESS=:9000 \
            -e RUSTFS_CONSOLE_ENABLE=false \
            -e RUSTFS_REGION=us-east-1 \
            -e RUSTFS_VOLUMES=/data \
            rustfs/rustfs:1.0.0
          timeout 90 sh -c 'until curl -fs http://localhost:9000/health/ready > /dev/null; do sleep 1; done' \
            || { echo "RustFS did not become ready"; docker logs rustfs; exit 1; }

      - name: "Start SFTP server"
        run: |
          docker run -d --name sftp -p 2222:22 \
            -v ${{ github.workspace }}/docker/sftp.json:/app/config/sftp.json:ro \
            emberstack/sftp:latest
          timeout 60 sh -c 'until nc -z localhost 2222; do sleep 1; done'
          echo "SFTP is ready"

      - name: "Setup PHP"
        uses: "./.github/actions/setup-php"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          extensions: ':psr, apcu, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, curl, pgsql, grpc, protobuf, :redis'
          ini-values: 'memory_limit=-1, post_max_size=32M, upload_max_filesize=32M, apc.enable_cli=1'
          tools: 'composer:v2'

      - name: "Install just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: "Install Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"

      - &pg-query-php-version
        name: "Resolve PHP version"
        id: php
        run: echo "version=$(php -r 'echo PHP_VERSION;')" >> "$GITHUB_OUTPUT"

      - &pg-query-cache
        name: "Cache pg_query.so"
        id: pg-query-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: src/extension/pg-query-ext/ext/modules/pg_query.so
          key: pg-query-ext-${{ runner.os }}-${{ runner.arch }}-php-${{ steps.php.outputs.version }}-${{ hashFiles('src/extension/pg-query-ext/**') }}

      - &pg-query-build-dependencies
        name: "Install pg-query-ext build dependencies"
        if: ${{ steps.pg-query-cache.outputs.cache-hit != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev

      - &pg-query-build
        name: "Build pg-query-ext"
        if: ${{ steps.pg-query-cache.outputs.cache-hit != 'true' }}
        working-directory: src/extension/pg-query-ext
        # a shallow checkout has no tags for config.m4 to describe; this build only runs the test suite
        run: |
          if ! git describe --tags --match '[0-9]*' >/dev/null 2>&1; then
            PG_QUERY_EXT_VERSION="0.0.0-0-g$(git rev-parse --short HEAD)"
            export PG_QUERY_EXT_VERSION
          fi
          make build

      - &pg-query-enable
        name: "Enable pg-query-ext"
        uses: ./.github/actions/enable-php-extension
        with:
          name: pg_query
          path: src/extension/pg-query-ext/ext/modules/pg_query.so

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Azurite storage emulator
        run: |
          npm ci --prefix .github/tools/azurite --no-audit --no-fund
          echo "${GITHUB_WORKSPACE}/.github/tools/azurite/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Start Azurite blob endpoint
        shell: bash
        run: |
          azurite-blob --blobHost 0.0.0.0 --blobPort 10000 > azurite.log 2>&1 &
          # any HTTP response means the endpoint is up; Azurite answers the bare root with an error status
          timeout 30 sh -c 'until curl -s -o /dev/null http://localhost:10000/; do sleep 1; done' \
            || { echo "Azurite did not become ready"; cat azurite.log; exit 1; }
        env:
          AZURITE_ACCOUNTS: flowphpaccount01:flowphpkey01

      # Main suite: everything except the grpc-exercising tests, so grpc is never
      # exercised here and the process shuts down cleanly. Must pass.
      - name: "Test"
        timeout-minutes: 15
        run: "just test --exclude-group grpc --log-junit ./var/phpunit/logs/junit.xml ${{ matrix.coverage && '--coverage-clover=./var/phpunit/coverage/clover/coverage.xml' || '' }}"
        env: &test-env
          PGSQL_DATABASE_URL: pgsql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?serverVersion=18&charset=utf8
          MYSQL_DATABASE_URL: mysql://mysql:mysql@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/flow
          ELASTICSEARCH_URL: http://127.0.0.1:${{ job.services.elasticsearch.ports['9200'] }}
          SQLITE_DATABASE_URL: "sqlite:///:memory:"
          AZURITE_HOST: "localhost"
          AZURITE_BLOB_PORT: "10000"
          AZURITE_ACCOUNT_NAME: "flowphpaccount01"
          AZURITE_ACCOUNT_KEY: "flowphpkey01"
          S3_ENDPOINT: "http://localhost:9000"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY_ID: "flowphpaccess01"
          S3_SECRET_ACCESS_KEY: "flowphpsecret01"
          SFTP_HOST: "localhost"
          SFTP_PORT: "2222"
          SFTP_USER: "flow"
          SFTP_PASSWORD: "flow"
          OTEL_RECEIVER_HTTP_ENDPOINT: "http://localhost:4318"
          OTEL_RECEIVER_GRPC_ENDPOINT: "localhost:4317"
          OTEL_COLLECTOR_METRICS_ENDPOINT: "http://localhost:8888/metrics"
          FLOW_PARQUET_TESTS_DEBUG: "0"

      # gRPC-exercising tests, isolated. grpc's EventEngine threads race PHP's extension
      # dlclose at process shutdown on PHP 8.5/amd64 (upstream grpc#38216, no released fix),
      # so this step is allowed to fail ONLY on 8.5. A real grpc test regression on 8.3/8.4
      # still fails CI. Remove continue-on-error once grpc ships a fix.
      - name: "Test (grpc)"
        timeout-minutes: 10
        continue-on-error: ${{ matrix.php-version == '8.5' }}
        run: "just test --group grpc --log-junit ./var/phpunit/logs/grpc-junit.xml ${{ matrix.coverage && '--coverage-clover=./var/phpunit/coverage/clover/grpc-coverage.xml' || '' }}"
        env: *test-env

      - name: "Upload code coverage to Codecov"
        if: ${{ !cancelled() && matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: ./var/phpunit/coverage/clover
          flags: tests

      - name: "Upload test results to Codecov"
        if: ${{ !cancelled() && matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: ./var/phpunit/logs
          report_type: test_results

  extension-tests:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    env:
      SNAPPY_CONFIGURE_PREFIX_OPTS: "CXXFLAGS=-std=c++11"
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"php-version":"8.3","dependencies":"locked"},{"php-version":"8.6","dependencies":"highest"}]'
          || '[{"php-version":"8.3","dependencies":"locked"},{"php-version":"8.4","dependencies":"highest"},{"php-version":"8.5","dependencies":"highest"},{"php-version":"8.6","dependencies":"highest"}]') }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install dependencies"
        run: |
          sudo apt-get update && sudo apt-get install libbrotli1 liblz4-1 libzstd1 --assume-yes

      - name: "Setup PHP"
        uses: "./.github/actions/setup-php"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: ${{ matrix.php-version == '8.3' && 'pcov' || 'none' }}
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, brotli, lz4, zstd, snappy-https://github.com/kjdev/php-ext-snappy@0.2.1, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2'

      - name: "Install just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: "Install Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"
          cache-key-suffix: "-extensions"

      - name: "Test Brotli"
        run: "just test --group brotli-extension ${{ matrix.php-version == '8.3' && '--coverage-clover=./var/phpunit/coverage/clover/brotli.xml' || '' }}"

      - name: "Test LZ4"
        run: "just test --group lz4-extension ${{ matrix.php-version == '8.3' && '--coverage-clover=./var/phpunit/coverage/clover/lz4.xml' || '' }}"

      - name: "Test ZSTD"
        run: "just test --group zstd-extension ${{ matrix.php-version == '8.3' && '--coverage-clover=./var/phpunit/coverage/clover/zstd.xml' || '' }}"

      - name: "Test Snappy"
        run: "just test --group snappy-extension ${{ matrix.php-version == '8.3' && '--coverage-clover=./var/phpunit/coverage/clover/snappy.xml' || '' }}"

      - name: Upload to Codecov
        if: ${{ !cancelled() && matrix.php-version == '8.3' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: ./var/phpunit/coverage/clover
          flags: extension-tests

  phpunit-telemetry-tests:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services: &telemetry-services
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 25
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"phpunit-version":"11","php-version":"8.3","dependencies":"locked"},{"phpunit-version":"13","php-version":"8.5","dependencies":"highest"},{"phpunit-version":"13","php-version":"8.6","dependencies":"highest"}]'
          || '[{"phpunit-version":"11","php-version":"8.3","dependencies":"locked"},{"phpunit-version":"12","php-version":"8.4","dependencies":"highest"},{"phpunit-version":"13","php-version":"8.5","dependencies":"highest"},{"phpunit-version":"13","php-version":"8.6","dependencies":"highest"}]') }}

    steps: &telemetry-test-steps
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup PHP"
        uses: "./.github/actions/setup-php"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: ${{ matrix.php-version == '8.3' && 'pcov' || 'none' }}
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, curl, pgsql, grpc, protobuf, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2'

      - name: "Install just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: "Install Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "${{ matrix.dependencies }}"

      - *pg-query-php-version

      - *pg-query-cache

      - *pg-query-build-dependencies

      - *pg-query-build

      - *pg-query-enable

      - name: "Install PHPUnit ${{ matrix.phpunit-version }}"
        run: |
          composer config --working-dir=tools/phpunit --unset platform
          composer require --working-dir=tools/phpunit --no-interaction --no-progress -W \
            "phpunit/phpunit:^${{ matrix.phpunit-version }}"

      - name: "Show PHPUnit version"
        run: tools/phpunit/vendor/bin/phpunit --version

      - name: "Test"
        run: just test --testsuite bridge-phpunit-postgresql-unit,bridge-phpunit-postgresql-integration,bridge-phpunit-telemetry-unit ${{ matrix.php-version == '8.3' && '--coverage-clover=./var/phpunit/coverage/clover/coverage.xml' || '' }}
        env:
          PGSQL_DATABASE_URL: pgsql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?serverVersion=18&charset=utf8

      - name: Upload to Codecov
        if: ${{ !cancelled() && matrix.php-version == '8.3' && matrix.phpunit-version == '11' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: ./var/phpunit/coverage/clover
          flags: telemetry-tests

  phpunit-telemetry-tests-other-combinations:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services: *telemetry-services
    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 13 requires PHP >= 8.4.1, so 13 x 8.3 is not in the list
        include:
          - phpunit-version: "11"
            php-version: "8.4"
            dependencies: "highest"
          - phpunit-version: "11"
            php-version: "8.5"
            dependencies: "highest"
          - phpunit-version: "11"
            php-version: "8.6"
            dependencies: "highest"
          - phpunit-version: "12"
            php-version: "8.3"
            dependencies: "locked"
          - phpunit-version: "12"
            php-version: "8.5"
            dependencies: "highest"
          - phpunit-version: "12"
            php-version: "8.6"
            dependencies: "highest"
          - phpunit-version: "13"
            php-version: "8.4"
            dependencies: "highest"

    steps: *telemetry-test-steps

  mutation-tests:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"
        operating-system:
          - "ubuntu-24.04"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history for git-diff-filter
          persist-credentials: false

      - name: "Setup PHP"
        uses: "./.github/actions/setup-php"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "pcov"
          extensions: ':psr, apcu, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, :redis'
          ini-values: 'memory_limit=-1, apc.enable_cli=1'
          tools: 'composer:v2'

      - name: "Install just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: "Install Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          cache-key-suffix: "-locked"

      - name: "Create cache directory"
        run: "mkdir -p var/infection/cache"

      - name: "Cache infection results"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
