          brew install autoconf automake libtool protobuf protobuf-c

      - name: Build libpg_query and extension
        working-directory: src/extension/pg-query-ext
        run: |
          make clean || true
          make build

      - name: Run extension tests
        working-directory: src/extension/pg-query-ext
        run: make test

      - name: Run requests on threads that did not load the extension
        if: matrix.php == '8.6' && matrix.ts == 'zts' && runner.os == 'Linux'
        working-directory: src/extension/pg-query-ext
        run: |
          # gdb returns 0 for a crashed test, so the plain run decides and gdb only prints the backtrace
          make test-zts || {
            sudo apt-get install -y gdb
            make test-zts ZTS_RUNNER="gdb -batch -ex run -ex \"thread apply all bt\" --args" || true
            exit 1
          }

      - name: Install extension
        uses: ./.github/actions/enable-php-extension
        with:
          name: pg_query
          path: src/extension/pg-query-ext/ext/modules/pg_query.so

  extension-pg-query-build-full-matrix:
    needs: changes
    if: ${{ needs.changes.outputs.extension-pg-query == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
        ts: ['nts', 'zts']
        exclude:
          - php: '8.3'
            ts: nts
          - php: '8.6'
            ts: zts
        include:
          - php: '8.3'
            dependencies: locked
          - php: '8.4'
            dependencies: highest
          - php: '8.5'
            dependencies: highest
          - php: '8.6'
            dependencies: highest

    steps: *extension-pg-query-build-steps

  extension-pg-query-build-macos:
    needs: changes
    if: ${{ needs.changes.outputs.extension-pg-query == 'true' && github.event_name != 'pull_request' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            ts: nts
            dependencies: locked

    steps: *extension-pg-query-build-steps

  extension-pg-query-build-macos-full-matrix:
    needs: changes
    if: ${{ needs.changes.outputs.extension-pg-query == 'true' && github.event_name != 'pull_request' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
        ts: ['nts', 'zts']
        exclude:
          - php: '8.3'
            ts: nts
        include:
          - php: '8.3'
            dependencies: locked
          - php: '8.4'
            dependencies: highest
          - php: '8.5'
            dependencies: highest
          - php: '8.6'
            dependencies: highest

    steps: *extension-pg-query-build-steps

  extension-pg-query-pie-install-test:
    needs: changes
    if: ${{ needs.changes.outputs.extension-pg-query == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04

    steps: &extension-pg-query-pie-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs history and tags to resolve the extension version
          fetch-depth: 0

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.3'
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2, phpize, php-config'

      - name: Install Composer Dependencies
        uses: ./.github/actions/composer-install
        with:
          php-version: '8.3'
          dependencies: locked

      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool protobuf protobuf-c

      - name: Install PIE
        run: |
          sudo curl -L -o /usr/local/bin/pie https://github.com/php/pie/releases/latest/download/pie.phar
          sudo chmod +x /usr/local/bin/pie
          pie --version

      - name: Prepare local package for PIE installation
        run: |
          # git archive applies export-subst like GitHub release archives, so the build resolves its version from .git_archival.txt
          git archive HEAD src/extension/pg-query-ext | tar -x -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/src/extension/pg-query-ext"
          jq '. + {"version": "0.0.9999"}' composer.json > composer.tmp.json
          mv composer.tmp.json composer.json

      - name: Install extension via PIE (from local)
        run: |
          sudo pie repository:remove packagist.org
          sudo pie repository:add path "$RUNNER_TEMP/src/extension/pg-query-ext"
          sudo pie install flow-php/pg-query-ext:0.0.9999@dev

      - name: Verify extension is loaded
        run: |
          php -m | grep pg_query

      - name: Verify extension version
        run: |
          expected="$(git describe --tags --match '[0-9]*' | sed -E 's/-([0-9]+)-(g[0-9a-f]+)$/+\1.\2/')"
          actual="$(php -r 'echo phpversion("pg_query");')"
          echo "expected: $expected, actual: $actual"
          test "$actual" = "$expected"

  extension-pg-query-pie-install-test-macos:
    needs: changes
    if: ${{ needs.changes.outputs.extension-pg-query == 'true' && github.event_name != 'pull_request' }}
    runs-on: macos-latest

    steps: *extension-pg-query-pie-steps

  website-build-phar:
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Setup PHP"
        uses: "./.github/actions/setup-php"
        with:
          php-version: "8.3"
          coverage: "none"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2'

      - name: "Install just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: "Install Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "8.3"
          dependencies: "locked"
          cache-key-suffix: "-locked-phar"

      - *pg-query-php-version

      - *pg-query-cache

      - *pg-query-build-dependencies

      - *pg-query-build

      - *pg-query-enable

      - name: "Build PHAR file"
        run: "just phar"

      - name: "Upload Flow PHAR"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "website-flow-phar"
          path: "web/landing/assets/wasm/tools/flow.phar"
          retention-days: 1

  website-build-docs:
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup PHP"
        uses: "./.github/actions/setup-php"
        with:
          php-version: "8.3"
          coverage: "none"
          extensions: ':psr, bcmath, curl, dom, hash, json, mbstring, pdo_sqlite, xml, xmlwriter, xmlreader, zip, zlib, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2'

      - name: "Install just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: "Install Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "8.3"
          dependencies: "locked"
          cache-key-suffix: "-locked"

      - name: "Install website Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "8.3"
          dependencies: "locked"
          working-directory: "web/landing"
          cache-key-suffix: "-website"
          composer-file: "web/landing/composer.lock"

      - name: "Build Docs"
        run: "just docs"

      - name: "Upload generated docs"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "website-flow-docs"
          path: |
            web/landing/resources/api.json
            web/landing/resources/dsl.json
            web/landing/resources/php.json
            web/landing/assets/codemirror/completions/flow-api.js
          retention-days: 1

  website-tests:
    needs: [changes, website-build-phar, website-build-docs]
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"
        operating-system:
          - "ubuntu-24.04"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Get Flow Version"
        id: flow_version
        uses: WyriHaximus/github-action-get-previous-tag@83f26fea93bc7efcbca2eb5591f5eaaf66b8f206 # v2.1.0
        with:
          fallback: 1.x-dev

      - name: "Setup PHP"
        uses: "./.github/actions/setup-php"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "pcov"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2'

      - name: "Install just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: "Install website Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          working-directory: "web/landing"
          cache-key-suffix: "-website"
          composer-file: "web/landing/composer.lock"

      - name: "Setup Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: "Create Wrangler dev.vars"
        run: |
          cat > .dev.vars << EOF
          TURNSTILE_SECRET_KEY=dummy
          TURNSTILE_MODE=bypass
          ENABLE_R2_PROXY=true
          RATE_LIMITER_MODE=bypass
          EOF
        working-directory: "terraform/cloudflare/workers"

      - name: "Start Wrangler in background"
        run: |
          npx wrangler@latest dev --port 8787 > wrangler.log 2>&1 &
          echo $! > wrangler.pid
          # Wait for wrangler to be ready
          timeout 30 bash -c 'until curl -s http://localhost:8787 > /dev/null; do sleep 1; done'
        working-directory: "terraform/cloudflare/workers"

      - name: "Download Flow PHAR"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "website-flow-phar"
          path: "web/landing/assets/wasm/tools"

      - name: "Download generated docs"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "website-flow-docs"
          path: "web/landing"

      # the website suite runs on the monorepo phpunit, not a copy of its own
      - name: "Install PHPUnit"
        run: "composer install --working-dir=tools/phpunit"

      - name: "Install Playwright server"
        run: "vendor/bin/playwright-install"
        working-directory: "web/landing"

      # Playwright advises against caching browsers on CI: https://playwright.dev/docs/ci#caching-browsers
      - name: "Install Playwright Chromium headless shell"
        run: "npx playwright install --with-deps --only-shell chromium"
        working-directory: "web/landing/vendor/playwright-php/playwright/bin"

      - name: "Test"
        run: "just test-website"
        env:
          PLAYGROUND_API_URL: "http://localhost:8787/api/playground/snippets"
          PLAYGROUND_SNIPPETS_URL: "http://localhost:8787"
          PLAYWRIGHT_HEADLESS: "true"

      - name: "Stop Wrangler"
        if: always()
        run: |
          if [ -f wrangler.pid ]; then
            kill "$(cat wrangler.pid)" || true
          fi
          if [ -f wrangler.log ]; then
            echo "=== Wrangler Logs ==="
            cat wrangler.log
          fi
        working-directory: "terraform/cloudflare/workers"

      - name: "Test Build"
        run: "composer build"
        working-directory: "web/landing"
        env:
          SCHEME: https
          DOMAIN: flow-php.com
          FLOW_VERSION: ${{ steps.flow_version.outputs.tag }}

  documentation-linter:
    needs: changes
    if: ${{ needs.changes.outputs.documentation == 'true' }}
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup PHP"
        uses: "./.github/actions/setup-php"
        with:
          php-version: "8.3"
          coverage: "none"
          extensions: ':psr, bcmath, curl, dom, hash, json, mbstring, pdo_sqlite, xml, xmlwriter, xmlreader, zip, zlib, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2'

      - name: "Install just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: "Install Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "8.3"
          dependencies: "locked"
          cache-key-suffix: "-locked"

      - name: "Install website Composer dependencies"
        uses: "./.github/actions/composer-install"
        with:
          php-version: "8.3"
          dependencies: "locked"
          working-directory: "web/landing"
          cache-key-suffix: "-website"
          composer-file: "web/landing/composer.lock"

      - name: "Build Docs"
        run: "just docs"

      - name: "MD Link Linter"
        uses: "docker://norberttech/md-link-linter@sha256:bf17e53dd716dcc2f0a41ed45af3e7bfc06b56b40fe6d8064b29646c1582c54c" # latest as of 2026-09-25
        with:
          entrypoint: "/composer/vendor/bin/mdlinklint"
          args: "--exclude=vendor --exclude=tests --exclude=examples --exclude=guides --exclude=documentation ."

  test-result:
    needs:
      - changes
      - static-analyze
      - tests
      - extension-tests
      - phpunit-telemetry-tests
      - phpunit-telemetry-tests-other-combinations
      - mutation-tests
      - extension-flow-php-build
      - extension-flow-php-build-full-matrix
      - extension-flow-php-build-macos
      - extension-flow-php-build-macos-full-matrix
      - extension-flow-php-pie-install-test
      - extension-flow-php-pie-install-test-macos
      - extension-arrow-build
      - extension-arrow-build-full-matrix
      - extension-arrow-build-macos
      - extension-arrow-build-macos-full-matrix
      - extension-arrow-pie-install-test
      - extension-arrow-pie-install-test-macos
      - extension-pg-query-build
      - extension-pg-query-build-full-matrix
      - extension-pg-query-build-macos
      - extension-pg-query-build-macos-full-matrix
      - extension-pg-query-pie-install-test
      - extension-pg-query-pie-install-test-macos
      - website-build-phar
      - website-build-docs
      - website-tests
      - documentation-linter
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: "Fail on a failed or cancelled job"
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
