          restore-keys: |
            php-${{ matrix.php-version }}-infection-cache-

      - name: "Mutation Tests"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            just test-mutation --git-diff-filter=AM --git-diff-base="origin/$BASE_REF" --ignore-msi-with-no-mutations --logger-github=false --log-verbosity=none
          else
            just test-mutation --logger-github=false --log-verbosity=none
          fi

  extension-flow-php-build:
    needs: changes
    if: ${{ needs.changes.outputs.extension-flow-php == 'true' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            ts: nts
            dependencies: locked
          - php: '8.6'
            ts: zts
            dependencies: highest

    steps: &extension-flow-php-build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs history and tags to resolve the extension version
          fetch-depth: 0

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
          thread-safety: ${{ matrix.ts }}
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, zstd, :redis'
          ini-values: 'memory_limit=-1'
          tools: 'composer:v2, php-config'
          coverage: ${{ (matrix.php == '8.3' && matrix.ts == 'nts' && runner.os == 'Linux') && 'pcov' || 'none' }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: Setup Rust extension toolchain
        id: rust
        uses: ./.github/actions/setup-rust-toolchain

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # ext-php-rs bindings are generated against the PHP headers, so builds are per PHP version and thread safety
          key: php${{ matrix.php }}${{ matrix.ts == 'zts' && '-zts' || '' }}
          save-if: ${{ github.ref == 'refs/heads/1.x' && runner.os == 'Linux' && github.job == 'extension-flow-php-build' }}
          workspaces: |
            src/extension/flow-php-ext -> target
            src/extension/arrow-ext -> target

      - name: Build arrow extension
        working-directory: src/extension/arrow-ext
        env: &extension-flow-php-rust-env
          LIBCLANG_PATH: ${{ steps.rust.outputs.libclang-path }}
          CLANG_PATH: ${{ steps.rust.outputs.clang-path }}
        run: make build

      - name: Build extension
        working-directory: src/extension/flow-php-ext
        env: *extension-flow-php-rust-env
        run: make build

      - name: Test flow_php workspace
        working-directory: src/extension/flow-php-ext
        env: *extension-flow-php-rust-env
        run: cargo test --workspace --locked --features arrow-validate

      - name: Lint flow_php workspace
        working-directory: src/extension/flow-php-ext
        env: *extension-flow-php-rust-env
        run: cargo fmt --all --check && cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Check both extensions lock the same flow-parquet-engine dependencies
        working-directory: src/extension
        run: |
          tree() { (cd "$1" && cargo tree --locked -p flow-parquet-engine --prefix none -e normal --target all | sed 's/ (.*)//' | sort -u); }
          diff <(tree arrow-ext) <(tree flow-php-ext)

      - name: Install Composer Dependencies
        uses: ./.github/actions/composer-install
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies }}

      - name: Run PHPT tests
        working-directory: src/extension/flow-php-ext
        env: *extension-flow-php-rust-env
        run: make test

      - name: Run requests on threads that did not load the extension
        if: matrix.php == '8.6' && matrix.ts == 'zts' && runner.os == 'Linux'
        working-directory: src/extension/flow-php-ext
        env: *extension-flow-php-rust-env
        run: |
          # gdb returns 0 for a crashed test, so the plain run decides and gdb only prints the backtrace
          cargo test --locked --features zts-embed --test zts_request_threads || {
            sudo apt-get install -y gdb
            cargo test --locked --features zts-embed --test zts_request_threads \
              --config "target.x86_64-unknown-linux-gnu.runner=[\"gdb\",\"-batch\",\"-ex\",\"run\",\"-ex\",\"thread apply all bt\",\"--args\"]" || true
            exit 1
          }

      - name: Rebuild extension for installation
        working-directory: src/extension/flow-php-ext
        env: *extension-flow-php-rust-env
        run: make build

      - name: Install extension and verify
        uses: ./.github/actions/enable-php-extension
        with:
          name: flow_php
          path: src/extension/flow-php-ext/ext/modules/flow_php.so

      - name: Run ETL Unit Tests with Flow PHP Extension
        run: just test --testsuite=etl-unit ${{ (matrix.php == '8.3' && matrix.ts == 'nts' && runner.os == 'Linux') && '--coverage-clover=./var/phpunit/coverage/clover/coverage.xml' || '' }}

      - name: Run ETL Integration Tests with Flow PHP Extension
        run: just test --testsuite=etl-integration

      - name: Run CSV Adapter Unit Tests with Flow PHP Extension
        run: just test --testsuite=adapter-csv-unit

      - name: Run CSV Adapter Integration Tests with Flow PHP Extension
        run: just test --testsuite=adapter-csv-integration

      - name: Run Parquet Adapter Unit Tests with Flow PHP Extension
        run: just test --testsuite=adapter-parquet-unit

      - name: Run Parquet Adapter Integration Tests with Flow PHP Extension
        run: just test --testsuite=adapter-parquet-integration

      - name: Install arrow extension next to flow_php
        uses: ./.github/actions/enable-php-extension
        with:
          name: arrow
          path: src/extension/arrow-ext/ext/modules/arrow.so

      - name: Run Parquet Adapter Unit Tests with both extensions
        run: just test --testsuite=adapter-parquet-unit

      - name: Run Parquet Adapter Integration Tests with both extensions
        run: just test --testsuite=adapter-parquet-integration

      - name: Upload to Codecov
        if: ${{ !cancelled() && matrix.php == '8.3' && matrix.ts == 'nts' && runner.os == 'Linux' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: ./var/phpunit/coverage/clover
          flags: flow-php-extension

