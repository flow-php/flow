name: Benchmarks

on:
  workflow_dispatch:
  pull_request_target:
    paths:
      - 'src/**'
      - 'phpbench.json.dist'

jobs:
  benchmark-tests:
    runs-on: benchmark
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          coverage: "none"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, pgsql, snappy-https://github.com/kjdev/php-ext-snappy@0.2.1'
          php-env: '{"SNAPPY_CONFIGURE_PREFIX_OPTS": "CXXFLAGS=-std=c++11"}'
          apt-packages: "build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev"
          pie-extensions: "flow-php/pg-query-ext:1.x-dev"
          cache-key-suffix: "-locked"

      - name: "Download phpbench benchmarks artifact"
        uses: dawidd6/action-download-artifact@v12
        with:
          workflow: baseline.yml
          name: phpbench-baseline
          path: ./var/phpbench/

      - name: "Generate phpbench.json with dynamic port"
        run: |
          sed 's/127.0.0.1:5432/127.0.0.1:${{ job.services.postgres.ports[5432] }}/' phpbench.json.dist > phpbench.json

      - name: "Execute benchmarks"
        id: init_comment
        run: |
          # Phase 1: Run with progress visible, store results, assert no regressions >10%
          tools/phpbench/vendor/bin/phpbench run \
            --ref=1.x \
            --progress=plain \
            --store \
            --tag=pr-run \
            --assert="variant.mode <= baseline.mode +/- 10%" \
            --assert="variant.mem.peak <= baseline.mem.peak +/- 10%" \
            --assert="rstdev(variant.time.avg) <= 5%"

          # Phase 2: Generate clean report from stored results
          tools/phpbench/vendor/bin/phpbench report \
            --ref=pr-run \
            --report=flow-report \
            > ./var/phpbench/benchmarks.txt

          {
            echo '# Flow PHP - Benchmarks'
            echo '<sup><sub>Comparing PR against 1.x baseline</sub></sup>'
            echo ''
            echo '```'
            cat ./var/phpbench/benchmarks.txt
            echo '```'
          } > "./var/phpbench/summary.txt"

      - uses: actions/upload-artifact@v6
        with:
          name: phpbench
          path: ./var/phpbench/summary.txt
          overwrite: true

      - name: Save PR number
        run: echo ${{ github.event.pull_request.number }} > ./pr-id.txt

      - name: Upload PR number
        uses: actions/upload-artifact@v6
        with:
          name: pr
          path: ./pr-id.txt
          overwrite: true

      - name: "Set job summary"
        run: |
          cat ./var/phpbench/summary.txt >> $GITHUB_STEP_SUMMARY
