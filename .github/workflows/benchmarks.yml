name: Benchmarks

on:
  workflow_dispatch:
  pull_request_target:
    paths:
      - 'src/**'
      - 'phpbench.json.dist'

jobs:
  benchmark-tests:
    runs-on: benchmark
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Get Composer Cache Directory"
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: "Cache Composer dependencies"
        uses: "actions/cache@v4"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "php-${{ matrix.php-version }}-locked-composer-benchmark-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            php-${{ matrix.php-version }}-locked-composer-benchmark-

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Download phpbench benchmarks artifact"
        uses: dawidd6/action-download-artifact@v12
        with:
          workflow: baseline.yml
          name: phpbench-baseline
          path: ./var/phpbench/

      - name: "Generate phpbench.json with dynamic port"
        run: |
          sed 's/127.0.0.1:5432/127.0.0.1:${{ job.services.postgres.ports[5432] }}/' phpbench.json.dist > phpbench.json

      - name: "Execute benchmarks"
        id: init_comment
        run: |
          # Phase 1: Run with progress visible, store results, assert no regressions >10%
          tools/phpbench/vendor/bin/phpbench run \
            --ref=1.x \
            --progress=plain \
            --store \
            --tag=pr-run \
            --assert="variant.mode <= baseline.mode +/- 10%" \
            --assert="variant.mem.peak <= baseline.mem.peak +/- 10%" \
            --assert="rstdev(variant.time.avg) <= 5%"

          # Phase 2: Generate clean report from stored results
          tools/phpbench/vendor/bin/phpbench report \
            --ref=pr-run \
            --report=flow-report \
            > ./var/phpbench/benchmarks.txt

          {
            echo '# Flow PHP - Benchmarks'
            echo '<sup><sub>Comparing PR against 1.x baseline</sub></sup>'
            echo ''
            echo '```'
            cat ./var/phpbench/benchmarks.txt
            echo '```'
          } > "./var/phpbench/summary.txt"

      - uses: actions/upload-artifact@v6
        with:
          name: phpbench
          path: ./var/phpbench/summary.txt
          overwrite: true

      - name: Save PR number
        run: echo ${{ github.event.pull_request.number }} > ./pr-id.txt

      - name: Upload PR number
        uses: actions/upload-artifact@v6
        with:
          name: pr
          path: ./pr-id.txt
          overwrite: true

      - name: "Set job summary"
        run: |
          cat ./var/phpbench/summary.txt >> $GITHUB_STEP_SUMMARY
