name: Benchmark Tests

on:
  workflow_dispatch:
  pull_request_target:
    paths:
      - 'src/**'
      - 'phpbench.json.dist'

jobs:
  benchmark-tests:
    runs-on: flow-php-runner
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "locked"
        php-version:
          - "8.3"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Setup PHP Environment"
        uses: "./.github/actions/setup-php-env"
        with:
          php-version: "${{ matrix.php-version }}"
          dependencies: "locked"
          coverage: "none"
          extensions: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib, pgsql, snappy-https://github.com/kjdev/php-ext-snappy@0.2.1'
          php-env: '{"SNAPPY_CONFIGURE_PREFIX_OPTS": "CXXFLAGS=-std=c++11"}'
          apt-packages: "build-essential autoconf automake libtool protobuf-compiler libprotobuf-c-dev"
          pie-extensions: "flow-php/pg-query-ext:1.x-dev"
          cache-key-suffix: "-locked"

      - name: "Download phpbench benchmarks artifact"
        uses: dawidd6/action-download-artifact@v12
        with:
          workflow: baseline.yml
          name: phpbench-baseline
          path: ./var/phpbench/

      - name: "Generate phpbench.json with dynamic port"
        run: |
          sed 's/127.0.0.1:5432/127.0.0.1:${{ job.services.postgres.ports[5432] }}/' phpbench.json.dist > phpbench.json

      - name: "Execute benchmarks"
        id: init_comment
        run: |
          composer test:benchmark:extractor -- --ref=1.x --progress=none > ./var/phpbench/extractor.txt
          composer test:benchmark:transformer -- --ref=1.x --progress=none > ./var/phpbench/transformer.txt
          composer test:benchmark:loader -- --ref=1.x --progress=none > ./var/phpbench/loader.txt
          composer test:benchmark:building_blocks -- --ref=1.x --progress=none > ./var/phpbench/building_blocks.txt
          composer test:benchmark:parquet-library -- --ref=1.x --progress=none > ./var/phpbench/parquet.txt

          # Build the summary file
          {
            echo '# Flow PHP - Benchmarks'
            echo '<sup><sub>Results of the benchmarks from this PR are compared with the results from 1.x branch.</sub></sup>'
            echo '  '
            echo '<details><summary>Extractors</summary>'
            echo '  '
            echo '```shell'
            cat ./var/phpbench/extractor.txt
            echo '```'
            echo '  '
            echo '</details>'
            echo '  '
            echo '<details><summary>Transformers</summary>'
            echo '  '
            echo '```shell'
            cat ./var/phpbench/transformer.txt
            echo '```'
            echo '  '
            echo '</details>'
            echo '  '
            echo '<details><summary>Loaders</summary>'
            echo '  '
            echo '```shell'
            cat ./var/phpbench/loader.txt
            echo '```'
            echo '  '
            echo '</details>'
            echo '  '
            echo '<details><summary>Building Blocks</summary>'
            echo '  '
            echo '```shell'
            cat ./var/phpbench/building_blocks.txt
            echo '```'
            echo '  '
            echo '</details>'
            echo '  '
            echo '<details><summary>Parquet Library</summary>'
            echo '  '
            echo '```shell'
            cat ./var/phpbench/parquet.txt
            echo '```'
            echo '  '
            echo '</details>'
            echo '  '
          } >> "./var/phpbench/summary.txt"

      - uses: actions/upload-artifact@v6
        with:
          name: phpbench
          path: ./var/phpbench/summary.txt
          overwrite: true

      - name: Save PR number
        run: echo ${{ github.event.pull_request.number }} > ./pr-id.txt

      - name: Upload PR number
        uses: actions/upload-artifact@v6
        with:
          name: pr
          path: ./pr-id.txt
          overwrite: true

      - name: "Set job summary"
        run: |
          cat ./var/phpbench/summary.txt >> $GITHUB_STEP_SUMMARY
