on:
  push:
    branches:
      - 1.x
    tags:
      - '*'
    paths-ignore:
      - 'CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  packages_split:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    strategy:
      fail-fast: false
      matrix:
        # define package to repository map
        package:
          - local_path: 'src/core/etl'
            split_repository: 'etl'
          - local_path: 'src/cli'
            split_repository: 'cli'

          - local_path: 'src/lib/array-dot'
            split_repository: 'array-dot'
          - local_path: 'src/lib/azure-sdk'
            split_repository: 'azure-sdk'
          - local_path: 'src/lib/doctrine-dbal-bulk'
            split_repository: 'doctrine-dbal-bulk'
          - local_path: 'src/lib/parquet'
            split_repository: 'parquet'
          - local_path: 'src/lib/parquet-viewer'
            split_repository: 'parquet-viewer'
          - local_path: 'src/lib/dremel'
            split_repository: 'dremel'
          - local_path: 'src/lib/filesystem'
            split_repository: 'filesystem'
          - local_path: 'src/lib/snappy'
            split_repository: 'snappy'
          - local_path: 'src/lib/types'
            split_repository: 'types'
          - local_path: 'src/lib/postgresql'
            split_repository: 'postgresql'
          - local_path: 'src/lib/telemetry'
            split_repository: 'telemetry'

          - local_path: 'src/adapter/etl-adapter-avro'
            split_repository: 'etl-adapter-avro'
          - local_path: 'src/adapter/etl-adapter-chartjs'
            split_repository: 'etl-adapter-chartjs'
          - local_path: 'src/adapter/etl-adapter-csv'
            split_repository: 'etl-adapter-csv'
          - local_path: 'src/adapter/etl-adapter-doctrine'
            split_repository: 'etl-adapter-doctrine'
          - local_path: 'src/adapter/etl-adapter-excel'
            split_repository: 'etl-adapter-excel'
          - local_path: 'src/adapter/etl-adapter-google-sheet'
            split_repository: 'etl-adapter-google-sheet'
          - local_path: 'src/adapter/etl-adapter-http'
            split_repository: 'etl-adapter-http'
          - local_path: 'src/adapter/etl-adapter-json'
            split_repository: 'etl-adapter-json'
          - local_path: 'src/adapter/etl-adapter-logger'
            split_repository: 'etl-adapter-logger'
          - local_path: 'src/adapter/etl-adapter-parquet'
            split_repository: 'etl-adapter-parquet'
          - local_path: 'src/adapter/etl-adapter-text'
            split_repository: 'etl-adapter-text'
          - local_path: 'src/adapter/etl-adapter-xml'
            split_repository: 'etl-adapter-xml'
          - local_path: 'src/adapter/etl-adapter-postgresql'
            split_repository: 'etl-adapter-postgresql'
          - local_path: 'src/adapter/etl-adapter-seal'
            split_repository: 'etl-adapter-seal'

          - local_path: 'src/bridge/filesystem/azure'
            split_repository: 'filesystem-azure-bridge'
          - local_path: 'src/bridge/filesystem/async-aws'
            split_repository: 'filesystem-async-aws-bridge'
          - local_path: 'src/bridge/filesystem/sftp'
            split_repository: 'filesystem-sftp-bridge'
          - local_path: 'src/bridge/monolog/http'
            split_repository: 'monolog-http-bridge'
          - local_path: 'src/bridge/monolog/telemetry'
            split_repository: 'monolog-telemetry-bridge'
          - local_path: 'src/bridge/openapi/specification'
            split_repository: 'openapi-specification-bridge'
          - local_path: 'src/bridge/mago/types'
            split_repository: 'mago-types-bridge'
          - local_path: 'src/bridge/phpstan/types'
            split_repository: 'phpstan-types-bridge'
          - local_path: 'src/bridge/postgresql/valinor'
            split_repository: 'postgresql-valinor-bridge'
          - local_path: 'src/bridge/psr3/telemetry'
            split_repository: 'psr3-telemetry-bridge'
          - local_path: 'src/bridge/psr7/telemetry'
            split_repository: 'psr7-telemetry-bridge'
          - local_path: 'src/bridge/psr18/telemetry'
            split_repository: 'psr18-telemetry-bridge'
          - local_path: 'src/bridge/symfony/filesystem-bundle'
            split_repository: 'symfony-filesystem-bundle'
          - local_path: 'src/bridge/symfony/filesystem-cache'
            split_repository: 'symfony-filesystem-cache-bridge'
          - local_path: 'src/bridge/symfony/http-foundation'
            split_repository: 'symfony-http-foundation-bridge'
          - local_path: 'src/bridge/symfony/http-foundation-telemetry'
            split_repository: 'symfony-http-foundation-telemetry-bridge'
          - local_path: 'src/bridge/symfony/postgresql-bundle'
            split_repository: 'symfony-postgresql-bundle'
          - local_path: 'src/bridge/symfony/postgresql-cache'
            split_repository: 'symfony-postgresql-cache-bridge'
          - local_path: 'src/bridge/symfony/postgresql-messenger'
            split_repository: 'symfony-postgresql-messenger-bridge'
          - local_path: 'src/bridge/symfony/postgresql-session'
            split_repository: 'symfony-postgresql-session-bridge'
          - local_path: 'src/bridge/symfony/telemetry-bundle'
            split_repository: 'symfony-telemetry-bundle'
          - local_path: 'src/bridge/telemetry/otlp'
            split_repository: 'telemetry-otlp-bridge'
          - local_path: 'src/bridge/phpunit/postgresql'
            split_repository: 'phpunit-postgresql-bridge'
          - local_path: 'src/bridge/phpunit/telemetry'
            split_repository: 'phpunit-telemetry-bridge'

          - local_path: 'src/extension/pg-query-ext'
            split_repository: 'pg-query-ext'
          - local_path: 'src/extension/arrow-ext'
            split_repository: 'arrow-ext'
          - local_path: 'src/extension/flow-php-ext'
            split_repository: 'flow-php-ext'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Load GitHub App private key"
        id: app-credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: "2.42.0"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_PRIVATE_KEY: op://ci/github-app-flow-ci/private

      - name: "Create GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLOW_PHP_CI_CLIENT_ID }}
          private-key: ${{ steps.app-credentials.outputs.APP_PRIVATE_KEY }}
          owner: flow-php
          repositories: ${{ matrix.package.split_repository }}
          permission-contents: write
          permission-workflows: write

      - name: "Resolve GitHub App bot identity"
        id: bot
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          {
            echo "name=${APP_SLUG}[bot]"
            echo "email=${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - name: "Split ${{ matrix.package.local_path }} to flow-php/${{ matrix.package.split_repository }}"
        env:
          SPLIT_TOKEN: ${{ steps.app-token.outputs.token }}
          SPLIT_REPOSITORY: ${{ matrix.package.split_repository }}
          SPLIT_LOCAL_PATH: ${{ matrix.package.local_path }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          set -euo pipefail
          remote="https://github.com/flow-php/${SPLIT_REPOSITORY}.git"
          helper="!f() { echo username=x-access-token; echo \"password=\${SPLIT_TOKEN}\"; }; f"
          git_auth() { git -c credential.helper= -c credential.helper="$helper" "$@"; }
          git_author() { git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" "$@"; }

          message="$(git show -s --format=%B "$GITHUB_SHA")"
          message="${message%%$'\n'*}"
          attempt=1

          while true; do
            build="$(mktemp -d)"
            heads="$(git_auth ls-remote --heads "$remote" 1.x)"

            if [ -n "$heads" ]; then
              git_auth clone --quiet --depth 1 --branch 1.x "$remote" "$build"
            else
              echo "flow-php/${SPLIT_REPOSITORY} has no 1.x branch, starting it as an orphan."
              git -C "$build" init --quiet
              git -C "$build" remote add origin "$remote"
              git -C "$build" checkout --quiet --orphan 1.x
            fi

            find "$build" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "${SPLIT_LOCAL_PATH}/." "$build/"
            git -C "$build" add --all
            changes="$(git -C "$build" status --porcelain)"

            if [ -z "$changes" ]; then
              echo "flow-php/${SPLIT_REPOSITORY} 1.x is up to date."
              break
            fi

            git_author -C "$build" commit --quiet --message "$message"
            push_exit=0
            push_status="$(git_auth -C "$build" push --porcelain origin 1.x)" || push_exit=$?

            if [ "$push_exit" -eq 0 ]; then
              break
            fi

            echo "$push_status"

            if [ "$attempt" -eq 3 ] || ! grep -qF '[rejected]' <<< "$push_status"; then
              exit "$push_exit"
            fi

            echo "flow-php/${SPLIT_REPOSITORY} 1.x moved during the split, attempt $((attempt + 1)) of 3."
            rm -rf "$build"
            attempt=$((attempt + 1))
          done

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git_author -C "$build" tag -a "$GITHUB_REF_NAME" -m "Publishing $GITHUB_REF_NAME"
            git_auth -C "$build" push --quiet origin "$GITHUB_REF_NAME"
          fi

          rm -rf "$build"
