name: "Report a website problem"
description: "A problem on flow-php.com: documentation, examples, blog, playground or search."
labels: ["triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong or missing?
      description: Screenshots help. For a visual bug, name the browser and the device.
    validations:
      required: true
  - type: textarea
    id: pages
    attributes:
      label: Pages
      description: One URL per line.
      placeholder: "https://flow-php.com/documentation/components/adapters/csv"
    validations:
      required: false
