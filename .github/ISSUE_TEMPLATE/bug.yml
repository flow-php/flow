name: "Report a bug"
description: "Existing code does not work as documented."
type: "Bug"
labels: ["triage"]
projects: ["flow-php/projects/1"]
assignees: ["norberttech"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw and what you expected. Paste the error output here.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Code that reproduces it
      description: The smallest PHP code that shows the bug, or a link to a playground snippet. No backticks needed.
      render: php
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flow version
      placeholder: "0.48.0"
    validations:
      required: true
