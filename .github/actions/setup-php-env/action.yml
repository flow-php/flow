name: 'Setup PHP Environment'
description: 'Setup PHP with extensions, caching, and install dependencies'
inputs:
  php-version:
    description: 'PHP version to setup'
    required: true
  dependencies:
    description: 'Dependency resolution strategy (locked/lowest/highest) or custom value'
    required: true
  extensions:
    description: 'PHP extensions to install'
    required: false
    default: ':psr, bcmath, dom, hash, json, mbstring, xml, xmlwriter, xmlreader, zlib'
  ini-values:
    description: 'PHP ini values to set'
    required: false
    default: 'memory_limit=-1'
  tools:
    description: 'Tools to install'
    required: false
    default: 'composer:v2'
  coverage:
    description: 'Coverage driver (none/pcov/xdebug)'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for composer operations'
    required: false
    default: '.'
  cache-key-suffix:
    description: 'Additional suffix for cache key'
    required: false
    default: ''
  composer-file:
    description: 'Path to composer.lock file for cache key'
    required: false
    default: '**/composer.lock'
  install-dependencies:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  php-env:
    description: 'Environment variables for PHP setup'
    required: false
    default: ''
  apt-packages:
    description: 'Additional apt packages to install before PHP setup (e.g., libprotobuf-c-dev for pg_query extension)'
    required: false
    default: ''
  pie-extensions:
    description: 'Space-separated list of PHP extensions to install via PIE (e.g., "flow-php/pg-query-ext:1.x-dev")'
    required: false
    default: ''
  extra-working-directory:
    description: 'Optional additional Composer project to install (e.g. "web/landing"). Left empty to skip.'
    required: false
    default: ''
  extra-cache-key-suffix:
    description: 'Cache key suffix for the extra working directory'
    required: false
    default: ''
  extra-composer-file:
    description: 'composer.lock path (for the cache key) of the extra working directory'
    required: false
    default: '**/composer.lock'

runs:
  using: "composite"
  steps:
    - name: "Install apt packages"
      if: ${{ inputs.apt-packages != '' }}
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ${{ inputs.apt-packages }}

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        tools: ${{ inputs.tools }}
        php-version: ${{ inputs.php-version }}
        ini-values: ${{ inputs.ini-values }}
        # The runner image ships ext-redis 5.3.7 pre-installed, which conflicts with
        # symfony/cache (requires ext-redis >= 6.1) and breaks `composer install`.
        # Pin a compatible phpredis (>= 6.1, and new enough to build on PHP 8.5) so the
        # extension stays available for the redis cache tests instead of being dropped.
        extensions: "${{ inputs.extensions }}, redis-6.3.0"
        coverage: ${{ inputs.coverage != '' && inputs.coverage || null }}
      env: ${{ inputs.php-env != '' && fromJSON(inputs.php-env) || fromJSON('{}') }}

    - name: "Install just"
      uses: extractions/setup-just@v3

    - name: "Install PIE"
      if: ${{ inputs.pie-extensions != '' }}
      shell: bash
      run: |
        curl -L -o /usr/local/bin/pie https://github.com/php/pie/releases/latest/download/pie.phar
        chmod +x /usr/local/bin/pie
        pie --version

    - name: "Install PIE extensions"
      if: ${{ inputs.pie-extensions != '' }}
      shell: bash
      run: |
        for ext in ${{ inputs.pie-extensions }}; do
          echo "Installing extension: $ext"
          sudo pie install "$ext"
        done

    - name: "Install Composer dependencies"
      if: ${{ inputs.install-dependencies == 'true' }}
      uses: "./.github/actions/composer-install"
      with:
        php-version: "${{ inputs.php-version }}"
        dependencies: "${{ inputs.dependencies }}"
        working-directory: "${{ inputs.working-directory }}"
        cache-key-suffix: "${{ inputs.cache-key-suffix }}"
        composer-file: "${{ inputs.composer-file }}"

    - name: "Install extra Composer dependencies"
      if: ${{ inputs.install-dependencies == 'true' && inputs.extra-working-directory != '' }}
      uses: "./.github/actions/composer-install"
      with:
        php-version: "${{ inputs.php-version }}"
        dependencies: "${{ inputs.dependencies }}"
        working-directory: "${{ inputs.extra-working-directory }}"
        cache-key-suffix: "${{ inputs.extra-cache-key-suffix }}"
        composer-file: "${{ inputs.extra-composer-file }}"