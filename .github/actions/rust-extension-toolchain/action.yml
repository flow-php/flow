name: "Rust extension toolchain"
description: "Installs the stable Rust toolchain plus the clang/libclang and autotools that ext-php-rs extensions need to build (directly or through PIE)"

outputs:
  libclang-path:
    description: "Directory holding libclang, for LIBCLANG_PATH"
    value: ${{ steps.clang.outputs.libclang-path }}
  clang-path:
    description: "clang executable from the same llvm as libclang, for CLANG_PATH"
    value: ${{ steps.clang.outputs.clang-path }}

runs:
  using: "composite"
  steps:
    - name: "Install Rust toolchain"
      uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: "Install build dependencies (Ubuntu)"
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf automake libtool clang libclang-dev

    - name: "Install build dependencies (macOS)"
      if: runner.os == 'macOS'
      shell: bash
      run: brew install autoconf automake libtool llvm

    - name: "Locate clang"
      id: clang
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          # Pin the clang executable to the one shipped with the same llvm as
          # libclang. Otherwise clang-sys (used by ext-php-rs's bindgen) falls
          # back to `xcodebuild -find clang` and mixes Xcode's clang headers
          # (e.g. arm_neon.h) with brew's newer libclang, which fails to compile.
          echo "libclang-path=$(brew --prefix llvm)/lib" >> "$GITHUB_OUTPUT"
          echo "clang-path=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Find the canonical libclang.so shared library, excluding the
        # Clang runtime support libraries under llvm-*/lib/clang/*/lib/.
        LIBCLANG_SO=$(find /usr/lib \
          \( -name 'libclang.so' -o -name 'libclang.so.*' -o -name 'libclang-*.so' -o -name 'libclang-*.so.*' \) \
          -not -path '*/clang/*/lib/*' \
          2>/dev/null | head -1)
        if [ -z "$LIBCLANG_SO" ]; then
          echo "Could not locate libclang.so under /usr/lib" >&2
          exit 1
        fi
        echo "Detected libclang at: $LIBCLANG_SO"
        echo "libclang-path=$(dirname "$LIBCLANG_SO")" >> "$GITHUB_OUTPUT"
        echo "clang-path=$(command -v clang)" >> "$GITHUB_OUTPUT"
