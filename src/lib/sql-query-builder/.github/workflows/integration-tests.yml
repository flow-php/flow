name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_sqlite
        coverage: none
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Run SQLite integration tests
      run: ./vendor/bin/phpunit tests/Flow/ETL/SQL/QueryBuilder/Tests/Integration/SQLiteIntegrationTest.php

  postgresql-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_pgsql
        coverage: none
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Run PostgreSQL integration tests
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: flow_test
      run: ./vendor/bin/phpunit tests/Flow/ETL/SQL/QueryBuilder/Tests/Integration/PostgreSQLIntegrationTest.php

  mysql-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flow_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_mysql
        coverage: none
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Wait for MySQL
      run: |
        while ! mysqladmin ping -h"127.0.0.1" -P3306 --silent; do
          sleep 1
        done
    
    - name: Run MySQL integration tests
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: root
        MYSQL_DATABASE: flow_test
      run: ./vendor/bin/phpunit tests/Flow/ETL/SQL/QueryBuilder/Tests/Integration/MySQLIntegrationTest.php

  adapter-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_sqlite
        coverage: none
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Run adapter integration tests
      run: ./vendor/bin/phpunit tests/Flow/ETL/SQL/QueryBuilder/Tests/Integration/AdapterIntegrationTest.php