[package]
name = "arrow"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# arrow-data re-validates the arrays built with `build_unchecked`; `make test` builds with it
arrow-validate = ["arrow-array/force_validate"]
# links libphp, only for tests/zts_request_threads.rs
zts-embed = ["ext-php-rs/embed"]

[dependencies]
ext-php-rs = "0.16"
arrow-array = { version = "60", features = ["ffi"] }
flow-parquet-engine = { path = "crates/flow-parquet-engine", features = ["arrow-names"] }

[dev-dependencies]
arrow-schema = { version = "60", features = ["canonical_extension_types"] }

[profile.release]
strip = true

[workspace]
members = ["crates/*"]
