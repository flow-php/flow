[package]
name = "flow_php"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# arrow-data re-validates the arrays the builders hand over with `build_unchecked`; `make test` builds with it
arrow-validate = ["arrow-data/force_validate"]
# links libphp, so only tests/zts_request_threads.rs enables it
zts-embed = ["ext-php-rs/embed"]

[dependencies]
ahash = "0.8"
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-data.workspace = true
arrow-schema.workspace = true
arrow-select = "60"
bytes = "1"
ext-php-rs = "0.16"
flow-batch-frame = { path = "crates/flow-batch-frame" }
flow-column-kernels = { path = "crates/flow-column-kernels" }
flow-column-text = { path = "crates/flow-column-text" }
flow-parquet-engine = { path = "crates/flow-parquet-engine", features = ["flow-php-names"] }
flow-csv-tokenizer = { path = "crates/flow-csv-tokenizer" }
flow-json-records = { path = "crates/flow-json-records" }
flow-numeric-string = { path = "crates/flow-numeric-string" }
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
ext-php-rs-build = "0.2"

[profile.release]
strip = true

[workspace]
members = ["crates/*"]

[workspace.dependencies]
arrow-array = { version = "60", features = ["ffi"] }
arrow-buffer = "60"
arrow-data = "60"
arrow-schema = { version = "60", features = ["canonical_extension_types"] }
md-5 = "0.10"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
