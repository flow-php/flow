file_format: '1.0'

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # OTLP JSON file receiver — picks up JSONL written by flow-php StreamTransport.
  # Docs: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/otlpjsonfilereceiver
  otlpjsonfile:
    include:
      - /var/otel/*.jsonl
    start_at: end

  # PostgreSQL metrics receiver
  # Docs: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/postgresqlreceiver
  postgresql:
    endpoint: postgres:5432
    transport: tcp
    username: postgres
    password: postgres
    databases:
      - postgres
    collection_interval: 10s
    tls:
      insecure: true

  # MySQL metrics receiver
  # Docs: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/mysqlreceiver
  mysql:
    endpoint: mysql:3306
    username: root
    password: root
    database: mysql
    collection_interval: 10s
    tls:
      insecure: true

  # Redis metrics receiver
  # Docs: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/redisreceiver
  redis:
    endpoint: redis:6379
    collection_interval: 10s
    tls:
      insecure: true

exporters:
  debug:
    verbosity: basic
  otlp_grpc/aspire:
    endpoint: aspire:18889
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage/queue
      num_consumers: 4
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0

processors:
  # Add service.name to PostgreSQL metrics
  resource/postgresql:
    attributes:
      - key: service.name
        value: postgresql
        action: upsert
      - key: service.namespace
        value: flow-php
        action: upsert

  # Add service.name to MySQL metrics
  resource/mysql:
    attributes:
      - key: service.name
        value: mysql
        action: upsert
      - key: service.namespace
        value: flow-php
        action: upsert

  # Add service.name to Redis metrics
  resource/redis:
    attributes:
      - key: service.name
        value: redis
        action: upsert
      - key: service.namespace
        value: flow-php
        action: upsert

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    timeout: 10s
    compaction:
      directory: /var/lib/otelcol/queue
      on_start: true

service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    traces:
      sampler:
        trace_id_ratio_based:
          ratio: 0.1
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4318
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
        - periodic:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://aspire:18889
                insecure: true
    logs:
      level: warn
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4318
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp_grpc/aspire]
    metrics:
      receivers: [otlp]
      exporters: [debug, otlp_grpc/aspire]
    metrics/postgresql:
      receivers: [postgresql]
      processors: [resource/postgresql]
      exporters: [debug, otlp_grpc/aspire]
    metrics/mysql:
      receivers: [mysql]
      processors: [resource/mysql]
      exporters: [debug, otlp_grpc/aspire]
    metrics/redis:
      receivers: [redis]
      processors: [resource/redis]
      exporters: [debug, otlp_grpc/aspire]
    logs:
      receivers: [otlp]
      exporters: [debug, otlp_grpc/aspire]
    logs/file:
      receivers: [otlpjsonfile]
      exporters: [debug, otlp_grpc/aspire]
