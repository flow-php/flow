flow_telemetry:
    resource:
        custom:
            service.name: flow-php.com
    exporters:
        otlp_http:
            otlp:
                transport:
                    type: curl
                    endpoint: 'http://127.0.0.1:4318'
                    timeout_ms: 1000
                    connect_timeout_ms: 250
                    encoding: json
    tracer_provider:
        sampler:
            type: always_on
        processor:
            type: batching
            batch_size: 512
            exporter: otlp_http
    meter_provider:
        temporality: cumulative
        processor:
            type: batching
            exporter: otlp_http
    logger_provider:
        processor:
            type: batching
            exporter: otlp_http
    instrumentation:
        http_kernel:
            enabled: true
            context_propagation: true
            exclude_paths:
                - path: '#\/_wdt.*#'
                - path: '#^\/_profiler.*#'
        console:
            enabled: true
            exclude_commands:
                - 'cache:clear'
                - 'debug:router'
        twig:
            enabled: true
            trace_templates: true
            trace_blocks: false
            trace_macros: false
            exclude_templates:
                - '/\@WebProfiler*/'
        http_client:
            enabled: true
        cache:
            enabled: true
