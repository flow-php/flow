flow_telemetry:
  service:
    name: "flow-website"
    version: "1.0.0"
    attributes:
      deployment.environment: "%kernel.environment%"

  tracer_provider:
    sampler:
      type: always_on
    processor:
      type: batching
      batch_size: 512
      exporter:
        type: otlp
        otlp:
          transport:
            type: curl
            endpoint: "http://localhost:4318"
            timeout: 30
            serializer:
              type: json

  meter_provider:
    temporality: cumulative
    processor:
      type: batching
      exporter:
        type: otlp
        otlp:
          transport:
            type: curl
            endpoint: "http://localhost:4318"
            timeout: 30
            serializer:
              type: json

  logger_provider:
    processor:
      type: batching
      exporter:
        type: otlp
        otlp:
          transport:
            type: curl
            endpoint: "http://localhost:4318"
            timeout: 30
            serializer:
              type: json

  instrumentation:
    http_kernel: true
    console: true
