php-version = "8.3"

[source]
paths = [
    "bin",
    "src",
    "web/landing/bin",
    "web/landing/src",
    "web/landing/tests",
]
includes = [
    "vendor",
    "tools/phpunit/vendor",
    # Generated by protoc
    "src/lib/postgresql/src/Flow/PostgreSql/Protobuf",
    # Generated by Thrift
    "src/lib/parquet/src/Flow/Parquet/ThriftModel",
]
excludes = [
    "src/**/vendor/**",
    "**/var/**",
    "**/extension/*/ext/build/**",
    "**/extension/*/ext/run-tests.php",
]

[parser]
enable-short-tags = false

[analyzer]
plugins = ["flow-php"]
excludes = [
    "**/Flow/Types/PHPStan/**",
]
ignore = [
    # `type_mapper()` uses a `@var TypeMapper<TType, TType>` in the terminal branch
    # so PHPStan can bind the second template. Mago infers it from the @return
    # conditional and reports the annotation as redundant.
    { code = "redundant-docblock-type", in = [
        "src/lib/postgresql/src/Flow/PostgreSql/DSL/client.php",
    ] },
    # `Dom\HTMLDocument::createFromString` and `::saveHtml` are PHP 8.4+ APIs.
    # The codebase supports PHP 8.3 | 8.4 | 8.5 and gates these calls with
    # `instanceof Dom\HTMLDocument` checks — on PHP 8.3 the class doesn't exist
    # so the guarded branch is never entered. Mago 1.27 flags the symbol
    # reference itself; suppress for these specific files.
    { code = "unavailable-method", in = [
        "src/lib/types/src/Flow/Types/Type/Logical/HTMLElementType.php",
        "src/lib/types/src/Flow/Types/Type/Logical/HTMLType.php",
        "src/lib/types/src/Flow/Types/Type/Native/StringType.php",
        "src/lib/types/tests/Flow/Types/Tests/Unit/Type/Logical/HTMLElementTypeTest.php",
        "src/lib/types/tests/Flow/Types/Tests/Unit/Type/Logical/HTMLTypeTest.php",
        "src/lib/types/tests/Flow/Types/Tests/Unit/Type/Native/StringTypeTest.php",
        "src/lib/types/tests/Flow/Types/Tests/Unit/Type/TypeDetectorTest.php",
    ] },
]

[linter]
integrations = ["symfony", "phpunit"]
excludes = [
    "**/Flow/Parquet/ThriftModel/**",
    "**/Flow/Parquet/Thrift/**",
    "**/otlp/src/Opentelemetry/**",
    "**/otlp/src/GPBMetadata/**",
    "**/lib/postgresql/src/Flow/PostgreSql/Protobuf/**",
]

[linter.rules]
cyclomatic-complexity = { enabled = false }
excessive-nesting = { enabled = false }
excessive-parameter-list = { enabled = false }
halstead = { enabled = false }
kan-defect = { enabled = false }
too-many-enum-cases = { enabled = false }
too-many-methods = { enabled = false }
too-many-properties = { enabled = false }
class-name = { enabled = false }
constant-name = { enabled = false }
enum-name = { enabled = false }
file-name = { enabled = false }
function-name = { enabled = false }
interface-name = { enabled = false }
trait-name = { enabled = false }
single-class-per-file = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
literal-named-argument = { enabled = false }
tagged-fixme = { enabled = false }
tagged-todo = { enabled = false }
prefer-static-closure = { enabled = false }
prefer-arrow-function = { enabled = false }
prefer-early-continue = { enabled = false }
no-else-clause = { enabled = false }
no-hash-comment = { enabled = false }
no-empty-catch-clause = { enabled = false }
no-isset = { enabled = false }
no-nested-ternary = { enabled = false }
no-assign-in-condition = { enabled = false }
explicit-octal = { enabled = false }
readable-literal = { enabled = false }
no-redundant-final = { enabled = false }
no-empty-loop = { enabled = false }
no-empty = { enabled = false }
loop-does-not-iterate = { enabled = false }
no-debug-symbols = { enabled = false }
no-multi-assignments = { enabled = false }
identity-comparison = { enabled = false }
strict-assertions = { enabled = false }
assert-description = { enabled = false }
use-specific-assertions = { enabled = false }
prefer-first-class-callable = { enabled = false }
final-controller = { enabled = false }
prefer-interface = { enabled = false }
no-shorthand-ternary = { enabled = false }
no-error-control-operator = { enabled = false }
no-literal-password = { enabled = false }
no-ini-set = { enabled = false }
instanceof-stringable = { enabled = false }
no-redundant-file = { enabled = false }
no-sprintf-concat = { enabled = false }
no-global = { enabled = false }
no-redundant-method-override = { enabled = false }
no-redundant-else = { enabled = true, level = "warning" }
# Bug in Mago 1.26 - revisit when resolved
no-redundant-variable = { enabled = true, level = "warning", exclude = [
    "**/Flow/ETL/Function/ScalarFunctionChain.php",
    "**/Flow/ETL/DataFrame.php",
    "**/Flow/ETL/Row/EntryReference.php",
    "**/Flow/ETL/Sort/SortAlgorithms.php",
    "**/Flow/PostgreSql/QueryBuilder/**",
    "**/Flow/PostgreSql/Tests/Unit/QueryBuilder/Expression/MockExpression.php",
    "**/Flow/PostgreSql/Explain/Plan/PlanNodeType.php",
    "**/Flow/Filesystem/Path.php",
    "**/CacheSpyClient.php",
    "**/Tests/Unit/ObjectExtractorTest.php",
    "**/array-dot/src/Flow/ArrayDot/array_dot.php",
    "**/TracableHttpClientTest.php",
] }
strict-types = { enabled = true, level = "error" }
no-fully-qualified-global-function = { enabled = true, level = "help", exclude = [
    # File defines `function sprintf()` in Flow\ETL\DSL, so `\sprintf(...)` calls must stay fully-qualified.
    "**/Flow/ETL/DSL/functions.php",
] }
no-fully-qualified-global-class-like = { enabled = true, level = "help", exclude = [
    # These files declare `class Ulid` / `class Uuid` that intentionally shadow Symfony/Ramsey classes,
    # so their fully-qualified references must stay as-is.
    "**/Flow/ETL/Function/Ulid.php",
    "**/Flow/ETL/Function/Uuid.php",
    # Namespace has its own `Table` class (Flow\ETL\Adapter\Doctrine\Table) — importing
    # `Doctrine\DBAL\Schema\Table` shadows it and breaks the public function signatures.
    "**/Flow/ETL/Adapter/Doctrine/functions.php",
] }
no-fully-qualified-global-constant = { enabled = true, level = "help" }
