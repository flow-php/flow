php-version = "8.3"

[source]
paths = [
    "benchmarks",
    "bin",
    "src",
    "web/landing/bin",
    "web/landing/src",
    "web/landing/tests",
]
includes = [
    "vendor",
    "tools/phpunit/vendor",
    "tools/phpbench/vendor",
    # Mago PHP SDK consumed by src/bridge/mago/types
    "tools/mago/vendor",
    # Generated by protoc
    "src/lib/postgresql/src/Flow/PostgreSql/Protobuf",
    # Generated by Thrift
    "src/lib/parquet/src/Flow/Parquet/ThriftModel",
    # Generated by protoc (OTLP protocol definitions)
    "src/bridge/telemetry/otlp/src/Opentelemetry",
    "src/bridge/telemetry/otlp/src/GPBMetadata",
    # C extension stub
    "src/extension/pg-query-ext/ext/pg_query.stub.php",
    # Symfony
    "src/bridge/symfony/filesystem-bundle/src/Flow/Bridge/Symfony/FilesystemBundle/FlowFilesystemBundle.php",
    "src/bridge/symfony/postgresql-bundle/src/Flow/Bridge/Symfony/PostgreSqlBundle/FlowPostgreSqlBundle.php",
    "src/bridge/symfony/telemetry-bundle/src/Flow/Bridge/Symfony/TelemetryBundle/FlowTelemetryBundle.php",
]
excludes = [
    "src/**/vendor/**",
    "**/var/**",
    "**/extension/*/ext/build/**",
    "**/extension/*/ext/run-tests.php",
]

[parser]
enable-short-tags = false

# The flow-php/mago-types-bridge package (src/bridge/mago/types) replaces the built-in flow-php
# plugin: same type_structure() shape derivation, plus structure_element() marker support the
# compiled-in plugin does not have yet.
[extension-hosts.flow]
command = ["php", "tools/mago/worker.php"]

[analyzer]
plugins = ["flow/types"]
excludes = [
    # PHPStan extension bridge: implements PHPStan's type API + tests via TypeInferenceTestCase; not analyzable by Mago.
    "src/bridge/phpstan/types/**",
    # Marketing website is analyzed in its own Mago run (see web/landing/mago.toml) so its separate vendor resolves without duplicating root packages; the root run only lints it.
    "web/landing/**",
    "src/bridge/symfony/filesystem-bundle/tests/Flow/Bridge/Symfony/FilesystemBundle/Tests/Unit/FlowFilesystemBundleTest.php",
    "src/bridge/symfony/filesystem-bundle/tests/Flow/Bridge/Symfony/FilesystemBundle/Tests/Unit/ConfigurationTest.php",
    "src/bridge/symfony/postgresql-bundle/tests/Flow/Bridge/Symfony/PostgreSqlBundle/Tests/Unit/DependencyInjection/ConfigurationTest.php",
    "src/bridge/symfony/postgresql-bundle/tests/Flow/Bridge/Symfony/PostgreSqlBundle/Tests/Integration/FlowPostgreSqlExtensionTest.php",
    "src/bridge/symfony/telemetry-bundle/tests/Flow/Bridge/Symfony/TelemetryBundle/Tests/Unit/DependencyInjection/ConfigurationTest.php",
]
ignore = []

[linter]
integrations = ["symfony", "phpunit"]
excludes = [
    "**/Flow/Parquet/ThriftModel/**",
    "**/Flow/Parquet/Thrift/**",
    "**/otlp/src/Opentelemetry/**",
    "**/otlp/src/GPBMetadata/**",
    "**/lib/postgresql/src/Flow/PostgreSql/Protobuf/**",
]

[linter.rules]
cyclomatic-complexity = { enabled = false }
excessive-nesting = { enabled = false }
excessive-parameter-list = { enabled = false }
halstead = { enabled = false }
kan-defect = { enabled = false }
too-many-enum-cases = { enabled = false }
too-many-methods = { enabled = false }
too-many-properties = { enabled = false }
class-name = { enabled = false }
constant-name = { enabled = false }
enum-name = { enabled = false }
file-name = { enabled = false }
function-name = { enabled = false }
interface-name = { enabled = false }
trait-name = { enabled = false }
single-class-per-file = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
literal-named-argument = { enabled = false }
tagged-fixme = { enabled = false }
tagged-todo = { enabled = false }
prefer-static-closure = { enabled = false }
prefer-arrow-function = { enabled = false }
prefer-early-continue = { enabled = false }
no-else-clause = { enabled = false }
no-hash-comment = { enabled = false }
no-empty-catch-clause = { enabled = false }
no-isset = { enabled = false }
no-nested-ternary = { enabled = false }
no-assign-in-condition = { enabled = false }
explicit-octal = { enabled = false }
readable-literal = { enabled = false }
no-redundant-final = { enabled = false }
no-empty-loop = { enabled = false }
no-empty = { enabled = false }
loop-does-not-iterate = { enabled = false }
no-debug-symbols = { enabled = false }
no-multi-assignments = { enabled = false }
identity-comparison = { enabled = false }
strict-assertions = { enabled = false }
assert-description = { enabled = false }
use-specific-assertions = { enabled = false }
prefer-first-class-callable = { enabled = false }
final-controller = { enabled = false }
prefer-interface = { enabled = false }
no-shorthand-ternary = { enabled = false }
no-error-control-operator = { enabled = false }
no-literal-password = { enabled = false }
no-ini-set = { enabled = false }
instanceof-stringable = { enabled = false }
no-redundant-file = { enabled = false }
no-sprintf-concat = { enabled = false }
no-global = { enabled = false }
no-redundant-method-override = { enabled = false }
no-duplicate-match-arm = { enabled = false }
no-redundant-else = { enabled = true, level = "warning" }
no-redundant-variable = { enabled = true, level = "warning" }
strict-types = { enabled = true, level = "error" }
no-fully-qualified-global-function = { enabled = true, level = "error" }
no-fully-qualified-global-class-like = { enabled = true, level = "error" }
no-fully-qualified-global-constant = { enabled = true, level = "error" }
disallowed-functions = { enabled = true, level = "error", functions = [{ name = "var_dump", help = "Debugging only — remove before commit." }, { name = "print_r", help = "Debugging only — remove before commit." }, { name = "dd", help = "Debugging only — remove before commit." }, { name = "dj", help = "Debugging only — remove before commit." }, { name = "ddj", help = "Debugging only — remove before commit." }] }

[guard]
mode = "perimeter"
excludes = ["src/**/tests/**"]
# Flow\Documentation\Attribute\* is documentation metadata resolved only by bin/docs.php; exempt from "a direct import gets a direct require".

[[guard.perimeter.restrictions]]
dependency = "Flow\\ETL\\**"
deny-from = [
    "Flow\\ArrayDot\\**", "Flow\\Azure\\**", "Flow\\Doctrine\\Bulk\\**", "Flow\\Dremel\\**",
    "Flow\\Parquet\\**", "Flow\\PostgreSql\\**", "Flow\\Snappy\\**", "Flow\\Telemetry\\**", "Flow\\Types\\**",
    "Flow\\Filesystem\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Flow\\ArrayComparison\\**"
deny-from = [
    "Flow\\ArrayDot\\**", "Flow\\Azure\\**", "Flow\\Doctrine\\Bulk\\**", "Flow\\Dremel\\**",
    "Flow\\Parquet\\**", "Flow\\PostgreSql\\**", "Flow\\Snappy\\**", "Flow\\Telemetry\\**", "Flow\\Types\\**",
    "Flow\\Filesystem\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Flow\\Calculator\\**"
deny-from = [
    "Flow\\ArrayDot\\**", "Flow\\Azure\\**", "Flow\\Doctrine\\Bulk\\**", "Flow\\Dremel\\**",
    "Flow\\Parquet\\**", "Flow\\PostgreSql\\**", "Flow\\Snappy\\**", "Flow\\Telemetry\\**", "Flow\\Types\\**",
    "Flow\\Filesystem\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Flow\\Clock\\**"
deny-from = [
    "Flow\\ArrayDot\\**", "Flow\\Azure\\**", "Flow\\Doctrine\\Bulk\\**", "Flow\\Dremel\\**",
    "Flow\\Parquet\\**", "Flow\\PostgreSql\\**", "Flow\\Snappy\\**", "Flow\\Telemetry\\**", "Flow\\Types\\**",
    "Flow\\Filesystem\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Flow\\Floe\\**"
deny-from = [
    "Flow\\ArrayDot\\**", "Flow\\Azure\\**", "Flow\\Doctrine\\Bulk\\**", "Flow\\Dremel\\**",
    "Flow\\Parquet\\**", "Flow\\PostgreSql\\**", "Flow\\Snappy\\**", "Flow\\Telemetry\\**", "Flow\\Types\\**",
    "Flow\\Filesystem\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Flow\\Serializer\\**"
deny-from = [
    "Flow\\ArrayDot\\**", "Flow\\Azure\\**", "Flow\\Doctrine\\Bulk\\**", "Flow\\Dremel\\**",
    "Flow\\Parquet\\**", "Flow\\PostgreSql\\**", "Flow\\Snappy\\**", "Flow\\Telemetry\\**", "Flow\\Types\\**",
    "Flow\\Filesystem\\**",
]
